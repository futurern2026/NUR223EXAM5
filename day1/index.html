<header><strong>NUR 223 · EXAM 5</strong><nav id="nav"></nav></header><main><div id="app"></div></main><footer>Day 1 lecture scope only · Progress saved locally in this browser · Educational practice</footer><script>const DATA={"questions": [{"topic": "Thyroid", "stem": "A client reports cold intolerance, constipation, fatigue, and weight gain. Which laboratory pattern best supports primary hypothyroidism?", "options": ["Normal TSH with elevated T3", "Elevated TSH with decreased free T4", "Decreased TSH with elevated free T4", "Elevated TSH with elevated free T4"], "correct": [1], "why": "A failing thyroid produces inadequate T4; the pituitary increases TSH through negative feedback.", "wrongwhy": [], "sata": false}, {"topic": "Thyroid", "stem": "A client recently started levothyroxine. Which new finding warrants evaluation for excessive replacement?", "options": ["Cold intolerance and fatigue", "Resting tachycardia and hand tremors", "Weight gain with bradycardia", "Constipation and dry skin"], "correct": [1], "why": "Excess thyroid hormone increases sympathetic effects and metabolic rate, producing tachycardia and tremor.", "wrongwhy": [], "sata": false}, {"topic": "Thyroid", "stem": "A client with severe hypothyroidism is hypothermic, hypotensive, and increasingly difficult to arouse. What is the priority?", "options": ["Encourage independent ambulation", "Delay intervention until routine TSH results", "Activate emergency response and support airway and ventilation", "Offer a high-fiber snack"], "correct": [2], "why": "Myxedema coma can produce hypoventilation, shock, and reduced consciousness; immediate stabilization is essential.", "wrongwhy": [], "sata": false}, {"topic": "Thyroid", "stem": "Which findings are consistent with untreated hypothyroidism? Select all that apply.", "options": ["Dry skin", "Cold intolerance", "Heat intolerance", "Bradycardia", "Constipation", "Frequent loose stools"], "correct": [0, 1, 3, 4], "why": "Reduced thyroid hormone slows cardiovascular and gastrointestinal activity and decreases heat production.", "wrongwhy": [], "sata": true}, {"topic": "Thyroid", "stem": "A client with Graves disease has weight loss despite increased appetite, palpitations, and heat intolerance. Which result is expected?", "options": ["Elevated TSH with low free T4", "Suppressed TSH with elevated free T4", "Elevated TSH and low T3", "Normal TSH and low T3"], "correct": [1], "why": "Excess thyroid hormone suppresses pituitary TSH through feedback.", "wrongwhy": [], "sata": false}, {"topic": "Thyroid", "stem": "A client with hyperthyroidism develops temperature 40.2°C (104.4°F), heart rate 154/min, agitation, and hypotension. What should the nurse do first?", "options": ["Arrange a routine follow-up visit", "Initiate emergency response, cardiac monitoring, and supportive stabilization", "Provide a high-calorie snack before reassessment", "Encourage strenuous exercise"], "correct": [1], "why": "Thyroid storm causes life-threatening hypermetabolism, dysrhythmias, and circulatory collapse.", "wrongwhy": [], "sata": false}, {"topic": "Thyroid", "stem": "Which findings suggest thyroid storm rather than uncomplicated hyperthyroidism? Select all that apply.", "options": ["Mild chronic constipation", "High fever", "Bradycardia", "Acute confusion", "Hypotension", "Severe tachycardia"], "correct": [1, 3, 4, 5], "why": "Thyroid storm is an acute systemic crisis marked by fever, severe cardiovascular instability, and altered mentation.", "wrongwhy": [], "sata": true}, {"topic": "Thyroid", "stem": "After thyroidectomy, a client develops inspiratory stridor and increasing neck swelling. What is the priority action?", "options": ["Call for immediate airway assistance and prepare emergency airway equipment", "Give oral fluids", "Document as expected postoperative discomfort", "Place the client flat and leave the room"], "correct": [0], "why": "Expanding neck hematoma or edema can obstruct the airway within minutes.", "wrongwhy": [], "sata": false}, {"topic": "Thyroid", "stem": "After thyroidectomy, a client reports tingling around the mouth and develops hand spasms. What complication is most likely?", "options": ["Fluid volume excess", "Hyperglycemia from stress", "Hypocalcemia from parathyroid injury", "Hyperkalemia from diet"], "correct": [2], "why": "Parathyroid dysfunction decreases calcium regulation; paresthesias and tetany are warning signs.", "wrongwhy": [], "sata": false}, {"topic": "Thyroid", "stem": "Which equipment should be immediately available after thyroidectomy? Select all that apply.", "options": ["Routine enema supplies", "Chest tube drainage system", "Oxygen delivery supplies", "Suction equipment", "Emergency airway/tracheostomy equipment"], "correct": [2, 3, 4], "why": "Hemorrhage and airway compromise are major immediate postoperative risks; rapid suction and airway support may be needed.", "wrongwhy": [], "sata": true}, {"topic": "Thyroid", "stem": "A client prescribed methimazole reports fever and sore throat. Which response is most appropriate?", "options": ["Treat only with an over-the-counter lozenge", "Take a double dose tomorrow", "Hold the next dose and promptly contact the prescriber for blood-count evaluation", "Continue without reporting symptoms"], "correct": [2], "why": "Fever and sore throat may indicate agranulocytosis, a serious adverse effect of antithyroid therapy.", "wrongwhy": [], "sata": false}, {"topic": "Thyroid", "stem": "Which teaching is appropriate for levothyroxine?", "options": ["Take consistently on an empty stomach and separate from calcium or iron supplements", "Stop taking it once symptoms resolve", "Double the dose whenever a dose is missed", "Take with calcium to improve absorption"], "correct": [0], "why": "Food, calcium, and iron can reduce absorption; consistent lifelong replacement is commonly required.", "wrongwhy": [], "sata": false}, {"topic": "Thyroid", "stem": "A client treated with radioactive iodine asks about long-term monitoring. What is the best response?", "options": ["The treatment provides immediate relief within minutes", "Thyroid hormone levels will never change again", "The treatment eliminates the need for follow-up", "Thyroid function must be monitored because hypothyroidism may develop"], "correct": [3], "why": "Radioactive iodine destroys functioning thyroid tissue and can result in hypothyroidism requiring replacement.", "wrongwhy": [], "sata": false}, {"topic": "Thyroid", "stem": "A client with hyperthyroidism reports new irregular palpitations and dizziness. Which assessment is the priority?", "options": ["Hair texture", "Usual bowel pattern", "Heart rhythm and hemodynamic status", "Daily fiber intake"], "correct": [2], "why": "Excess thyroid hormone increases risk for atrial fibrillation and cardiovascular compromise.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "A client with cirrhosis develops abdominal distention, ankle edema, and low serum albumin. Which mechanism best explains the edema?", "options": ["Increased clotting factors cause fluid retention", "Excess thyroid hormone increases metabolism", "Increased hemoglobin raises plasma viscosity", "Reduced hepatic albumin synthesis lowers plasma oncotic pressure"], "correct": [3], "why": "Low albumin permits fluid to shift out of blood vessels; portal hypertension also contributes to ascites.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "A client with cirrhosis vomits a large amount of bright red blood and is hypotensive. What is the priority?", "options": ["Schedule routine outpatient endoscopy", "Offer oral lactulose immediately", "Measure abdominal girth first", "Activate emergency response and support airway and circulation"], "correct": [3], "why": "Ruptured esophageal varices can cause massive hemorrhage and shock; stabilization precedes nonurgent care.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "Which findings suggest decompensated cirrhosis? Select all that apply.", "options": ["Normal coagulation and albumin values", "Hepatic encephalopathy", "Jaundice", "Ascites", "Esophageal variceal bleeding"], "correct": [1, 2, 3, 4], "why": "Ascites, jaundice, encephalopathy, and variceal hemorrhage are major manifestations of loss of hepatic compensation.", "wrongwhy": [], "sata": true}, {"topic": "Liver", "stem": "A client with cirrhosis is confused and demonstrates asterixis. Which medication is commonly used to reduce ammonia-related encephalopathy?", "options": ["Calcitonin", "Alendronate", "Lactulose", "Levothyroxine"], "correct": [2], "why": "Lactulose acidifies intestinal contents and promotes ammonia excretion through stool.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "A client receiving lactulose for hepatic encephalopathy has which outcome indicating an appropriate therapeutic response?", "options": ["No bowel movements for 48 hours", "Two to three soft stools per day with improving mentation", "Progressive confusion despite treatment", "Ten watery stools with hypotension"], "correct": [1], "why": "The common target is two to three soft stools daily, while avoiding dehydration and electrolyte loss.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "A client on lactulose develops frequent watery diarrhea and orthostatic dizziness. What should the nurse do?", "options": ["Consider severe diarrhea the intended endpoint", "Restrict all fluids without an order", "Increase the dose without reassessment", "Assess hydration and electrolytes and notify the prescriber about excessive stool losses"], "correct": [3], "why": "Excessive diarrhea can cause hypovolemia and electrolyte imbalance, worsening the client’s condition.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "Which laboratory findings support impaired liver synthetic function? Select all that apply.", "options": ["Low albumin", "Prolonged PT/INR", "Shortened PT/INR", "Increased serum calcium alone", "Elevated hemoglobin"], "correct": [0, 1], "why": "The liver produces albumin and many coagulation factors; reduced synthesis lowers albumin and prolongs clotting times.", "wrongwhy": [], "sata": true}, {"topic": "Liver", "stem": "A client with tense ascites reports dyspnea while lying flat. Which nursing action is appropriate?", "options": ["Encourage unrestricted sodium intake", "Place the client prone", "Delay assessment until the next shift", "Elevate the head of the bed and assess respiratory status"], "correct": [3], "why": "Ascitic fluid elevates the diaphragm and limits ventilation; upright positioning improves expansion.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "Which data are most useful for monitoring ascites over time? Select all that apply.", "options": ["Intake and output", "Hair color changes", "Abdominal girth measured consistently", "Daily weight", "Respiratory status"], "correct": [0, 2, 3, 4], "why": "Trends in weight, girth, fluid balance, and breathing reflect accumulation and effects of ascitic fluid.", "wrongwhy": [], "sata": true}, {"topic": "Liver", "stem": "A client with ascites develops fever, abdominal tenderness, and worsening confusion. What should the nurse suspect?", "options": ["Spontaneous bacterial peritonitis", "Expected effect of lactulose alone", "Uncomplicated dietary intolerance", "Stable compensated cirrhosis"], "correct": [0], "why": "Infection of ascitic fluid may cause fever, pain, and encephalopathy and requires prompt evaluation.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "A client with cirrhosis has elevated INR and easy bruising. Which teaching is most appropriate?", "options": ["Ignore black stools unless painful", "Use a straight razor for closer shaving", "Use a soft toothbrush and electric razor, and report bleeding", "Take aspirin for routine discomfort without checking"], "correct": [2], "why": "Reduced clotting-factor synthesis increases hemorrhage risk; injury prevention and prompt bleeding recognition matter.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "Which hepatitis types are primarily transmitted by fecally contaminated food or water? Select all that apply.", "options": ["Hepatitis B", "Hepatitis D", "Hepatitis A", "Hepatitis C", "Hepatitis E"], "correct": [2, 4], "why": "Hepatitis A and E use fecal–oral transmission; B, C, and D are associated with blood or body-fluid exposures.", "wrongwhy": [], "sata": true}, {"topic": "Liver", "stem": "A client has a positive hepatitis B surface antigen (HBsAg). What does this indicate?", "options": ["Complete absence of viral replication risk", "Confirmed immunity from vaccination alone", "No history of hepatitis B exposure", "Current hepatitis B infection"], "correct": [3], "why": "HBsAg is a marker of current HBV infection; anti-HBs indicates immunity.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "A client has a positive hepatitis C antibody screening result. Which test establishes whether infection is currently present?", "options": ["HCV RNA test", "TSH", "Serum calcium", "Urine ketones"], "correct": [0], "why": "Antibody indicates exposure, but RNA testing detects current viremia.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "Which statement about hepatitis D is accurate?", "options": ["Hepatitis D is prevented by the hepatitis A vaccine", "Hepatitis D cannot worsen liver disease", "Hepatitis D requires hepatitis B infection to replicate", "Hepatitis D spreads only through drinking water"], "correct": [2], "why": "HDV depends on HBV surface antigen; HBV vaccination also prevents HDV acquisition.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "An infant has persistent jaundice beyond two weeks, dark urine, and pale stools. What is the priority?", "options": ["Reassure the family this is always normal", "Delay evaluation until six months", "Prompt evaluation for biliary atresia and conjugated hyperbilirubinemia", "Begin iron supplementation without assessment"], "correct": [2], "why": "Obstructed bile flow can cause progressive liver damage; early diagnosis and referral are time-sensitive.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "Which findings support biliary atresia in an infant? Select all that apply.", "options": ["Normal-colored stools with resolved jaundice", "Persistent jaundice", "Dark urine", "Elevated direct bilirubin", "Clay-colored stools"], "correct": [1, 2, 3, 4], "why": "Impaired bile drainage reduces stool pigmentation and raises conjugated bilirubin, which can darken urine.", "wrongwhy": [], "sata": true}, {"topic": "Liver", "stem": "After liver transplantation, which finding should be reported promptly?", "options": ["Expected incisional soreness that is controlled", "Gradual improvement in appetite", "New fever with worsening jaundice", "Stable vital signs"], "correct": [2], "why": "Immunosuppression increases infection risk; new jaundice may also suggest graft dysfunction or biliary complications.", "wrongwhy": [], "sata": false}, {"topic": "Liver", "stem": "A client taking tacrolimus after liver transplant needs monitoring for which complications? Select all that apply.", "options": ["Infection", "Guaranteed absence of malignancy", "Improved immune defense against infection", "Hypertension", "Kidney dysfunction"], "correct": [0, 3, 4], "why": "Tacrolimus suppresses immunity and can cause nephrotoxicity and hypertension.", "wrongwhy": [], "sata": true}, {"topic": "Osteoporosis", "stem": "A postmenopausal client with osteoporosis asks why bone fracture risk increases. Which explanation is best?", "options": ["Bone resorption exceeds bone formation, reducing bone strength", "Bone formation always exceeds resorption", "The bones become denser with aging", "Only joint cartilage is affected"], "correct": [0], "why": "Osteoclast activity exceeds osteoblast formation, producing fragile bone vulnerable to fracture.", "wrongwhy": [], "sata": false}, {"topic": "Osteoporosis", "stem": "Which client is at greatest risk for osteoporosis?", "options": ["A thin, sedentary postmenopausal adult taking long-term glucocorticoids", "An adolescent with no additional risk factors", "An adult with a balanced diet and no fracture history", "An adult who performs regular resistance exercise and has adequate calcium intake"], "correct": [0], "why": "Low estrogen, inactivity, low body mass, and prolonged corticosteroid exposure compound bone loss.", "wrongwhy": [], "sata": false}, {"topic": "Osteoporosis", "stem": "Which findings are consistent with vertebral compression fractures from osteoporosis? Select all that apply.", "options": ["Hyperactive bowel sounds", "Kyphosis", "Increased standing height", "Persistent back pain", "Loss of height"], "correct": [1, 3, 4], "why": "Vertebral compression can shorten the spine, cause kyphotic posture, and produce back pain.", "wrongwhy": [], "sata": true}, {"topic": "Osteoporosis", "stem": "Which test is used to evaluate bone mineral density and diagnose osteoporosis?", "options": ["Pulmonary function testing", "Electrocardiogram", "Dual-energy X-ray absorptiometry (DXA)", "Upper endoscopy"], "correct": [2], "why": "DXA measures bone mineral density and helps estimate fracture risk.", "wrongwhy": [], "sata": false}, {"topic": "Osteoporosis", "stem": "Which instructions are appropriate for oral alendronate? Select all that apply.", "options": ["Wait at least 30 minutes before food or other medications", "Take on arising with a full glass of plain water", "Remain upright for at least 30 minutes", "Take with milk to prevent irritation", "Take immediately before lying down"], "correct": [0, 1, 2], "why": "Proper administration reduces esophageal irritation and supports absorption.", "wrongwhy": [], "sata": true}, {"topic": "Osteoporosis", "stem": "A client taking alendronate reports painful swallowing and new chest discomfort. What should the nurse recommend?", "options": ["Crush tablets in applesauce", "Increase the dose", "Stop taking the medication pending prompt prescriber evaluation", "Lie down after each dose"], "correct": [2], "why": "Bisphosphonates can cause severe esophagitis; dysphagia or chest pain requires evaluation.", "wrongwhy": [], "sata": false}, {"topic": "Osteoporosis", "stem": "Which interventions reduce fracture risk in osteoporosis? Select all that apply.", "options": ["Remove household trip hazards", "Avoid all physical activity", "Weight-bearing activity as tolerated", "Ensure adequate calcium and vitamin D", "Stop smoking", "Increase alcohol intake"], "correct": [0, 2, 3, 4], "why": "Exercise, nutrition, and fall prevention reduce bone loss and fracture exposure.", "wrongwhy": [], "sata": true}, {"topic": "Osteoporosis", "stem": "An older client with osteoporosis reports sudden severe back pain after bending to lift a light bag. Which complication should be suspected?", "options": ["Hyperosmolar hyperglycemic state", "Hepatic encephalopathy", "Thyroid storm", "Vertebral compression fracture"], "correct": [3], "why": "Fragile vertebrae can fracture with minimal trauma, presenting as acute focal back pain.", "wrongwhy": [], "sata": false}, {"topic": "Osteoporosis", "stem": "A client undergoes hip fracture repair. Which postoperative complication requires prevention and monitoring?", "options": ["Deep vein thrombosis", "Hepatitis A transmission", "Graves ophthalmopathy", "Myxedema coma"], "correct": [0], "why": "Surgery and reduced mobility increase venous thromboembolism risk.", "wrongwhy": [], "sata": false}, {"topic": "Osteoporosis", "stem": "Which foods support calcium intake? Select all that apply.", "options": ["Fortified milk", "Calcium-fortified beverages", "Broccoli", "Candy as the primary calcium source", "Yogurt"], "correct": [0, 1, 2, 4], "why": "Dairy, fortified products, and some green vegetables supply calcium needed for bone health.", "wrongwhy": [], "sata": true}, {"topic": "Diabetes", "stem": "A client with type 1 diabetes asks why insulin is necessary. Which response is most accurate?", "options": ["Autoimmune destruction of pancreatic beta cells causes marked insulin deficiency", "The kidneys stop filtering glucose completely", "The condition is caused only by eating sugar", "The body always makes excessive insulin"], "correct": [0], "why": "Type 1 diabetes is characterized by autoimmune beta-cell loss and requires exogenous insulin.", "wrongwhy": [], "sata": false}, {"topic": "Diabetes", "stem": "A client with type 2 diabetes has elevated glucose despite measurable insulin production. Which process is most likely?", "options": ["Excessive sensitivity to insulin in every tissue", "Insulin resistance with progressive beta-cell dysfunction", "An isolated red-cell disorder", "Complete absence of glucagon"], "correct": [1], "why": "Insulin resistance and declining secretion contribute to hyperglycemia in type 2 diabetes.", "wrongwhy": [], "sata": false}, {"topic": "Diabetes", "stem": "An alert client with diabetes is sweaty and shaky; capillary glucose is 54 mg/dL. What should the nurse do?", "options": ["Give approximately 15 g of fast-acting carbohydrate and recheck in 15 minutes", "Wait one hour without treatment", "Encourage exercise", "Administer scheduled rapid-acting insulin"], "correct": [0], "why": "For a conscious client who can swallow safely, the 15–15 approach rapidly corrects hypoglycemia.", "wrongwhy": [], "sata": false}, {"topic": "Diabetes", "stem": "A client with glucose 41 mg/dL is unresponsive and cannot swallow. Which action is appropriate?", "options": ["Activate emergency response and give ordered IV dextrose or glucagon", "Administer additional insulin", "Place food in the cheek", "Give orange juice by mouth"], "correct": [0], "why": "Oral intake is unsafe without airway protection; parenteral rescue treatment is required.", "wrongwhy": [], "sata": false}, {"topic": "Diabetes", "stem": "Which findings are characteristic of hypoglycemia? Select all that apply.", "options": ["Acute confusio eturn 'This does not address the mechanism, characteristic findings, or highest-priority safety need identified in this patient scenario.'}
