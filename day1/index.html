function matching(){let list=DATA.terms[matchCat],done=JSON.parse(localStorage.getItem(P+'match_'+matchCat)||'[]');let order=list.map((x,i)=>i).sort((a,b)=>((a*17+5)%list.length)-((b*17+5)%list.length));$('app').innerHTML=`<div class="hero"><h1>Vocabulary Matching</h1><p>Select a term, then select its definition. Four compact categories keep the game manageable.</p><div class="controls"><select onchange="matchCat=this.value;matchSel=null;matching()">${topics.map(t=>`<option ${matchCat===t?'selected':''}>${t}</option>`).join('')}</select><button class="secondary" onclick="localStorage.removeItem('${P}match_'+matchCat);matchSel=null;matching()">Reset category</button></div><div class="bar"><div style="width:${done.length/list.length*100}%"></div></div><span class="muted">${done.length} / ${list.length} matched</span></div><div class="panel"><div class="match-grid"><div><h2>Terms</h2>${list.map(([term],i)=>`<button class="term ${done.includes(i)?'done':''} ${matchSel===i?'selected':''}" ${done.includes(i)?'disabled':''} onclick="matchSel=${i};matching()">${esc(term)}</button>`).join('')}</div><div><h2>Definitions</h2>${order.map(i=>`<button class="definition ${done.includes(i)?'done':''}" ${done.includes(i)?'disabled':''} onclick="matchAnswer(${i})">${esc(list[i][1])}</button>`).join('')}</div></div><div id="matchFeedback" class="muted">${done.length===list.length?'Category complete! Choose another category.':'Choose a term and its matching definition.'}</div></div>`}
function matchAnswer(i){if(matchSel===null){$('matchFeedback').textContent='Select a term first.';return}let done=JSON.parse(localStorage.getItem(P+'match_'+matchCat)||'[]');if(i===matchSel){done.push(i);localStorage.setItem(P+'match_'+matchCat,JSON.stringify(done));matchSel=null;matching();$('matchFeedback').textContent='Correct match!'}else{$('matchFeedback').textContent='Not quite. Try another definition; your selected term is still active.'}}
function flashPool(){return Object.entries(DATA.terms).flatMap(([topic,items])=>items.map(([term,definition])=>({topic,term,definition}))).filter(x=>flashCat==='All'||x.topic===flashCat)}function flash(){let pool=flashPool();fi=(fi+pool.length)%pool.length;let x=pool[fi];$('app').innerHTML=`<div class="hero"><h1>Anki-Style Flashcards</h1><p>One card at a time. Click the card to reveal the definition.</p><div class="controls"><select onchange="flashCat=this.value;fi=0;flipped=false;flash()"><option>All</option>${topics.map(t=>`<option ${flashCat===t?'selected':''}>${t}</option>`).join('')}</select></div><span class="muted">Card ${fi+1} of ${pool.length} · ${x.topic}</span></div><div class="panel"><button class="flash" style="width:100%;color:white" onclick="flipped=!flipped;flash()">${esc(flipped?x.definition:x.term)}</button><div class="controls"><button class="secondary" onclick="fi--;flipped=false;flash()">← Previous</button><button class="primary" onclick="flipped=!flipped;flash()">Flip card</button><button class="secondary" onclick="fi++;flipped=false;flash()">Next →</button></div></div>`}
const bossPool=DATA.questions.map((q,i)=>({...q,id:i})).filter((q,i)=>i%3===0||q.sata).sort((a,b)=>((a.id*37)%97)-((b.id*37)%97));function boss(){let q=bossPool[bossIndex%bossPool.length];$('app').innerHTML=`<div class="hero"><h1>Clinical Judgment Boss Battle</h1><p>Mixed-topic challenge: answer without topic filters. Exact-match scoring for SATA.</p><span class="muted">Round ${bossIndex+1} of ${bossPool.length} · ${q.sata?'SATA':'Single best answer'}</span></div><div class="panel"><h2>${esc(q.stem)}</h2>${q.options.map((o,i)=>`<button class="option" id="bo${i}" onclick="bossChoose(${i})">${q.sata?'☐':String.fromCharCode(65+i)+'.'} ${esc(o)}</button>`).join('')}<div class="controls"><button class="primary" id="bossSubmit" onclick="bossGrade()" disabled>Submit</button><button class="secondary" onclick="bossIndex++;selected=[];boss()">Skip / next →</button></div><div id="bossFeedback"></div></div>`}function bossChoose(i){let q=bossPool[bossIndex%bossPool.length];selected=q.sata?(selected.includes(i)?selected.filter(x=>x!==i):[...selected,i]):[i];q.options.forEach((o,j)=>$('bo'+j).classList.toggle('selected',selected.includes(j)));$('bossSubmit').disabled=!selected.length}function bossGrade(){let q=bossPool[bossIndex%bossPool.length],ok=selected.length===q.correct.length&&selected.every(i=>q.correct.includes(i));q.options.forEach((o,i)=>{let e=$('bo'+i);e.disabled=true;e.classList.toggle('correct',q.correct.includes(i));e.classList.toggle('wrong',selected.includes(i)&&!q.correct.includes(i))});progress['boss'+q.id]=ok;save();$('bossSubmit').disabled=true;$('bossFeedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Boss defeated!':'Review the clinical reasoning'}</b><p>${esc(q.why)}</p><p><b>Correct:</b> ${q.correct.map(i=>esc(q.options[i])).join('; ')}</p><button class="primary" onclick="bossIndex++;selected=[];boss()">Next battle →</button></div>`}
render();
const EMBEDDED_CHALLENGES = "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>NUR 223 Exam 5 | Day 1 Clinical Challenges</title><style>\n:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf2ff;background:#0a1225}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#20365e,#0a1225 55%);min-height:100vh}header{background:#101d35f4;border-bottom:1px solid #395477;position:sticky;top:0;z-index:5;padding:13px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;gap:18px;flex-wrap:wrap}header strong{color:#fff;font-size:18px}header a,.secondary{background:#243657;color:#fff;border:1px solid #536d93;border-radius:10px;padding:9px 12px;text-decoration:none;font-size:14px}main{max-width:1050px;margin:auto;padding:28px 18px 90px}.hero{padding:24px 26px;border:1px solid #3a547a;background:linear-gradient(115deg,#1d355d,#13243e);border-radius:20px;margin-bottom:20px}.hero h1{margin:0 0 10px;color:#fff;font-size:clamp(25px,4vw,40px)}p{line-height:1.55;color:#c6d5ea}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card,.panel{border:1px solid #3b5577;border-radius:16px;background:#162641;padding:20px}.card h2,.panel h2{color:#fff;margin-top:0}.card p{min-height:58px}.primary{border:0;border-radius:10px;padding:11px 16px;background:#27c7c0;color:#061b27;font-weight:750;cursor:pointer}.primary:disabled{opacity:.5;cursor:default}.muted{font-size:13px;color:#aac2df}.chip{display:inline-block;background:#264a66;border:1px solid #487d9c;color:#d8faff;border-radius:30px;padding:5px 11px;font-size:13px;margin:4px 4px 4px 0}.option{display:block;text-align:left;width:100%;padding:14px;margin:9px 0;border-radius:12px;background:#203555;border:1px solid #537297;color:#f5f8ff;cursor:pointer;font:inherit}.option:disabled{cursor:default}.option.correct{border-color:#45d6a1;background:#174f45}.option.wrong{border-color:#ff8294;background:#573040}.feedback{border:1px solid #567ea0;background:#1a3450;padding:16px;border-radius:12px;margin:16px 0}.feedback.good{border-color:#41c99e}.feedback.bad{border-color:#ed8395}.feedback p{margin:8px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.bar{height:9px;background:#2b3e59;border-radius:30px;overflow:hidden;margin:12px 0}.bar>div{background:#29c5be;height:100%;transition:width .2s}select{background:#243657;color:white;border:1px solid #607e9f;border-radius:10px;padding:10px}.small{font-size:13px}.score{font-weight:700;color:#75f2cf}.qcard{margin:14px 0}.qcard h3{font-size:17px;line-height:1.5;margin:8px 0 15px;color:white}.qcard .option{margin:7px 0}.caseintro{border-left:3px solid #29c5be;padding:8px 18px;background:#203653;border-radius:8px}.simstep{margin:20px 0}.toplink{display:inline-block;color:#7de7e2;margin-bottom:16px}footer{text-align:center;padding:30px;color:#a9bed8;border-top:1px solid #304463}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}@media(max-width:600px){header{position:static}.card,.panel{padding:15px}.hero{padding:20px}}\n\n/* Drag-and-drop compare boards */\n.compare-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin-top:16px}\n.compare-zone{min-height:185px;border:2px dashed #7185a3;border-radius:16px;padding:14px;background:#17263a}\n.compare-zone.over{border-color:#64e0d1;background:#244154}\n.compare-zone h3{margin:0 0 5px;color:#f3f8ff}\n.compare-bank{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;padding:16px;border-radius:15px;background:#17263a;min-height:75px}\n.compare-tile{border:1px solid #8b9fbb;background:#253e5b;color:#fff;border-radius:12px;padding:10px 12px;cursor:grab;text-align:left;font:inherit;max-width:100%;touch-action:manipulation}\n.compare-tile.selected{outline:3px solid #f3d48a}\n.compare-tile:focus-visible{outline:3px solid #64e0d1}\n.compare-tile.correct{border-color:#51d8a5;background:#174f44;cursor:default}\n.compare-tile.wrong{border-color:#ff9c9c;background:#5a2933}\n.compare-tile small{display:block;color:#e4eefb;margin-top:5px;font-size:.82em;line-height:1.35}\n.compare-zone .compare-tile{display:block;width:100%;margin-top:8px;text-align:left}\n.compare-note{padding:12px;border:1px solid #8da1bb;border-radius:12px;margin:12px 0;color:#fff}\n.compare-pick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}\n.compare-pick button{border:1px solid #8da1bb;border-radius:10px;background:#243d59;color:#fff;padding:9px 13px;cursor:pointer}\n@media(max-width:680px){.compare-board{grid-template-columns:1fr}.compare-zone{min-height:110px}}\n</style></head><body><header><strong>NUR 223 · EXAM 5</strong><a href=\"index.html\">← Original Day 1 Arcade</a><a href=\"challenges.html\">Clinical Challenges</a></header><main><div id=\"app\"></div></main><footer>Day 1 lecture scope · Assigned reading informs rationales · Progress saved in this browser · Educational practice only</footer><script>\nconst GAMES={\"priority\":[{\"topic\":\"Thyroid\",\"stem\":\"Which client should the nurse assess first?\",\"options\":[\"Client with stable hypothyroidism reporting constipation\",\"Client 2 hours after thyroidectomy with new stridor and neck swelling\",\"Client with Graves disease reporting chronic heat intolerance\",\"Client taking levothyroxine who requests refill teaching\"],\"correct\":1,\"feedback\":[\"Constipation is a common nonemergent effect of slowed metabolism.\",\"Stridor and swelling suggest an expanding hematoma or airway obstruction; activate immediate airway help.\",\"Heat intolerance is expected with hyperthyroidism without acute instability.\",\"Routine medication education can wait until the airway threat is managed.\"]},{\"topic\":\"Liver\",\"stem\":\"Which client requires immediate intervention?\",\"options\":[\"Client with cirrhosis and mild ankle edema\",\"Client with chronic hepatitis C asking about screening\",\"Client with portal hypertension vomiting bright red blood and BP 82/48\",\"Client taking lactulose with two soft stools today\"],\"correct\":2,\"feedback\":[\"Edema needs monitoring but is not the immediate threat here.\",\"Screening education is important but not emergent.\",\"Hematemesis and hypotension suggest ruptured esophageal varices with hemorrhagic shock; mobilize emergency response.\",\"Two soft stools indicate the expected lactulose response.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Which patient is the highest priority?\",\"options\":[\"Awake patient with glucose 62 mg/dL and tremor\",\"Unresponsive patient with glucose 38 mg/dL\",\"Stable patient with HbA1c 8.1%\",\"Patient requesting insulin pen teaching\"],\"correct\":1,\"feedback\":[\"Symptomatic hypoglycemia needs prompt carbohydrate if safe to swallow, but airway is currently intact.\",\"Unresponsiveness with severe hypoglycemia threatens airway and brain function; initiate emergency treatment with IV dextrose or glucagon per protocol.\",\"HbA1c reflects long-term control, not immediate collapse.\",\"Teaching can occur after the emergency is addressed.\"]},{\"topic\":\"Thyroid\",\"stem\":\"Who should be seen first on a thyroid unit?\",\"options\":[\"Client on methimazole with fever 39°C and severe sore throat\",\"Client with controlled hypothyroidism and dry skin\",\"Client with chronic goiter without breathing changes\",\"Client asking when to take levothyroxine\"],\"correct\":0,\"feedback\":[\"Fever and sore throat during methimazole therapy can signal agranulocytosis and serious infection; urgent blood-count evaluation is needed.\",\"Dry skin is an expected chronic finding without immediate instability.\",\"A stable goiter warrants monitoring but no airway cues are described.\",\"Administration teaching is not time critical.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Which DKA client needs the most urgent provider notification?\",\"options\":[\"Glucose 285 mg/dL with ketones still present\",\"Glucose 340 mg/dL with thirst\",\"Potassium 2.8 mEq/L before ordered IV insulin\",\"Patient asking about sick-day fluids\"],\"correct\":2,\"feedback\":[\"Persistent ketosis requires ongoing treatment but is less immediately dangerous than severe hypokalemia.\",\"Hyperglycemia and thirst are expected in DKA and require treatment.\",\"Insulin shifts potassium into cells and can precipitate life-threatening dysrhythmias when potassium is already critically low; clarify and replace potassium first.\",\"Education follows stabilization.\"]},{\"topic\":\"Liver\",\"stem\":\"Which patient should be assessed first?\",\"options\":[\"Cirrhosis patient with new fever, abdominal tenderness and ascites\",\"Cirrhosis patient with unchanged spider angiomas\",\"Hepatitis A patient with mild nausea\",\"Stable transplant recipient requesting dietary information\"],\"correct\":0,\"feedback\":[\"New fever and abdominal pain with ascites suggest spontaneous bacterial peritonitis, which can progress to sepsis.\",\"Spider angiomas are a chronic manifestation of liver disease.\",\"Mild nausea can be managed after assessing possible peritonitis.\",\"Dietary counseling is not emergent.\"]},{\"topic\":\"Thyroid\",\"stem\":\"Which change needs immediate response?\",\"options\":[\"Client with hyperthyroidism reporting insomnia\",\"Client with thyroid storm, temperature 40°C, HR 160 and confusion\",\"Client with hypothyroidism reporting weight gain\",\"Client with Graves eye irritation\"],\"correct\":1,\"feedback\":[\"Insomnia is a common hypermetabolic symptom without instability.\",\"High fever, marked tachycardia and acute neurologic changes indicate thyroid storm with potential shock and dysrhythmia.\",\"Weight gain is expected with reduced metabolism.\",\"Eye irritation needs supportive care but is not more urgent than thyroid storm.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Which client should the nurse see first?\",\"options\":[\"Older adult with HHS, BP 86/50 and severe confusion\",\"Client with chronic diabetic neuropathy requesting footwear advice\",\"Client with glucose 145 mg/dL before lunch\",\"Client with stable Type 2 diabetes scheduling eye examination\"],\"correct\":0,\"feedback\":[\"Hypotension and altered mental status suggest severe dehydration and impaired perfusion from HHS; rapid assessment and IV fluid management are priorities.\",\"Neuropathy teaching prevents injury but is not emergent.\",\"This glucose level alone does not suggest a crisis.\",\"Retinal screening is preventive care.\"]},{\"topic\":\"Osteoporosis\",\"stem\":\"Which client needs priority assessment?\",\"options\":[\"Client asking about calcium-rich foods\",\"Client with osteoporosis and chronic mild height loss\",\"Client after hip fracture repair with sudden dyspnea and chest pain\",\"Client taking alendronate asking about weekly dosing\"],\"correct\":2,\"feedback\":[\"Nutrition education is important but not an acute threat.\",\"Gradual height loss is common with vertebral compression.\",\"Sudden dyspnea and chest pain after orthopedic surgery suggest pulmonary embolism, requiring immediate evaluation.\",\"Routine medication education can wait.\"]},{\"topic\":\"Liver\",\"stem\":\"Which transplant recipient needs immediate follow-up?\",\"options\":[\"Recipient requesting information about routine vaccines\",\"Recipient taking tacrolimus with fever and new confusion\",\"Recipient with mild fatigue after physical therapy\",\"Recipient requesting a medication schedule\"],\"correct\":1,\"feedback\":[\"Vaccination planning is important but nonurgent.\",\"Immunosuppression increases the risk of serious infection; fever and confusion may signal sepsis and require rapid assessment.\",\"Mild fatigue alone is not the most acute change.\",\"Medication organization can follow assessment.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Which call from home requires the most urgent response?\",\"options\":[\"Patient with glucose 115 mg/dL before breakfast\",\"Patient with mild thirst after exercise\",\"Type 1 patient with vomiting, positive ketones and deep rapid breathing\",\"Patient who forgot a routine foot inspection yesterday\"],\"correct\":2,\"feedback\":[\"This reading does not indicate an emergency.\",\"Thirst after exercise is nonspecific without other red flags.\",\"Vomiting, ketones and Kussmaul-type respirations suggest DKA and metabolic acidosis requiring emergency evaluation.\",\"Foot checks are important but not the immediate priority.\"]},{\"topic\":\"Liver\",\"stem\":\"Which pediatric client requires prompt diagnostic evaluation?\",\"options\":[\"Newborn with jaundice persisting beyond 2 weeks and clay-colored stools\",\"Newborn with normal yellow stools\",\"Infant with transient hiccups after feeding\",\"Infant with normal urine color and no jaundice\"],\"correct\":0,\"feedback\":[\"Persistent jaundice with pale stools suggests obstructed bile flow from biliary atresia; early evaluation is time sensitive.\",\"Normal pigmented stools do not suggest bile duct obstruction.\",\"Hiccups are not a characteristic warning sign of biliary atresia.\",\"No cholestatic findings are described.\"]}],\"meds\":[{\"topic\":\"Thyroid\",\"stem\":\"A client taking levothyroxine plans to take it with breakfast and calcium tablets. What is the best response?\",\"options\":[\"Approve both together\",\"Teach taking it on an empty stomach 30–60 minutes before breakfast and separating interfering supplements\",\"Tell the client to stop therapy once symptoms improve\",\"Recommend doubling the dose on weekends\"],\"correct\":1,\"feedback\":[\"Food and calcium can reduce absorption and create inconsistent thyroid replacement.\",\"Consistent empty-stomach dosing improves absorption; calcium or iron should be separated according to prescriber/pharmacist instructions.\",\"Hypothyroidism often requires long-term replacement; stopping can cause recurrence.\",\"Unprescribed dose changes risk overreplacement and dysrhythmias.\"]},{\"topic\":\"Thyroid\",\"stem\":\"A client receiving methimazole reports fever and sore throat. What should the nurse do?\",\"options\":[\"Document as an expected harmless effect\",\"Suggest an extra dose\",\"Promptly hold and clarify further dosing while arranging CBC/provider evaluation\",\"Encourage vigorous exercise\"],\"correct\":2,\"feedback\":[\"These symptoms can signal agranulocytosis and must not be dismissed.\",\"Extra antithyroid medication does not treat possible neutropenia.\",\"Agranulocytosis can cause dangerous infection; urgent evaluation is required.\",\"Exercise does not address the medication safety risk.\"]},{\"topic\":\"Thyroid\",\"stem\":\"A client taking propylthiouracil reports jaundice and dark urine. Which action is best?\",\"options\":[\"Continue without notification\",\"Urgently notify the prescriber and assess for liver injury\",\"Take the drug with grapefruit juice\",\"Wait until the next annual visit\"],\"correct\":1,\"feedback\":[\"Jaundice and dark urine are potential signs of hepatotoxicity.\",\"PTU can cause severe hepatic injury; prompt assessment and medication review are needed.\",\"Grapefruit juice does not treat possible drug-induced hepatitis.\",\"Delayed assessment could permit progressive liver injury.\"]},{\"topic\":\"Liver\",\"stem\":\"A patient taking lactulose for hepatic encephalopathy reports three soft stools daily and improved alertness. How should the nurse interpret this?\",\"options\":[\"Therapy is ineffective\",\"Expected therapeutic response\",\"Severe constipation\",\"Indication to double the dose independently\"],\"correct\":1,\"feedback\":[\"Improved cognition and target stool frequency support effectiveness.\",\"Lactulose promotes ammonia elimination; approximately 2–3 soft stools daily is a common treatment target.\",\"Three soft stools are not constipation.\",\"Extra dosing may cause diarrhea, dehydration and electrolyte loss.\"]},{\"topic\":\"Liver\",\"stem\":\"A liver transplant recipient taking tacrolimus has fever and a rising creatinine. What is the best action?\",\"options\":[\"Reassure that both findings are expected\",\"Notify transplant team for infection and nephrotoxicity assessment\",\"Stop all medications permanently\",\"Increase the dose to prevent rejection\"],\"correct\":1,\"feedback\":[\"Fever may reflect infection and creatinine elevation may indicate nephrotoxicity.\",\"Tacrolimus suppresses immunity and can injure kidneys; urgent clinical and laboratory review is indicated.\",\"Abruptly stopping immunosuppression can precipitate rejection.\",\"Dose escalation without evaluation may worsen toxicity.\"]},{\"topic\":\"Osteoporosis\",\"stem\":\"A client is about to take alendronate. Which administration plan is safest?\",\"options\":[\"Take with water on an empty stomach and remain upright\",\"Take with milk and lie down\",\"Crush into a high-fiber meal\",\"Take with calcium and immediately return to bed\"],\"correct\":0,\"feedback\":[\"Water, fasting administration and upright positioning reduce esophageal irritation and improve absorption.\",\"Milk interferes with absorption and lying down raises esophagitis risk.\",\"Food and crushing are inconsistent with standard safe oral administration.\",\"Calcium decreases absorption and recumbency raises esophageal injury risk.\"]},{\"topic\":\"Osteoporosis\",\"stem\":\"A client taking alendronate reports painful swallowing and new retrosternal pain. What should the nurse do?\",\"options\":[\"Encourage lying down after each dose\",\"Report possible esophageal injury and clarify further doses\",\"Recommend taking the next dose with yogurt\",\"Assure the client the pain is unrelated\"],\"correct\":1,\"feedback\":[\"Recumbency can worsen esophageal irritation.\",\"Odynophagia and chest pain may indicate bisphosphonate-associated esophagitis; evaluation is necessary.\",\"Dairy reduces absorption and does not resolve injury.\",\"These symptoms are clinically relevant adverse effects.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A patient with Type 1 diabetes is NPO for surgery. Which order requires clarification?\",\"options\":[\"Continue an individualized basal insulin plan\",\"Monitor blood glucose frequently\",\"Hold all basal insulin solely because the patient is NPO\",\"Review prandial insulin while food is withheld\"],\"correct\":2,\"feedback\":[\"Basal insulin generally remains necessary in Type 1 diabetes to prevent ketosis, with dose individualized.\",\"Monitoring is essential during fasting.\",\"Withholding all basal insulin in Type 1 diabetes can precipitate DKA.\",\"Meal-related insulin needs reassessment when the patient is not eating.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A patient has rapid-acting mealtime insulin due, but the meal tray is delayed. What is the best nursing action?\",\"options\":[\"Give it immediately without checking food availability\",\"Coordinate administration with actual meal availability and glucose\",\"Replace it with a double dose of basal insulin\",\"Skip all insulin for the day\"],\"correct\":1,\"feedback\":[\"Rapid-acting insulin before an unavailable meal increases hypoglycemia risk.\",\"Mealtime insulin should be synchronized with food intake and glucose status.\",\"Basal insulin is not a substitute for prandial dosing.\",\"Stopping all insulin can cause hyperglycemia or DKA, particularly in Type 1.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A client taking an SGLT2 inhibitor is scheduled for elective surgery. What teaching is appropriate?\",\"options\":[\"Continue until entering the operating room regardless of instructions\",\"Ask the prescriber about holding it about 3–4 days preoperatively\",\"Double it the morning of surgery\",\"Replace it with an OTC supplement\"],\"correct\":1,\"feedback\":[\"Perioperative use can increase risk of ketoacidosis, including with less marked hyperglycemia.\",\"Lecture guidance identifies a typical 3–4 day preoperative hold, individualized to the agent and surgical plan.\",\"Extra doses may increase adverse effects.\",\"Supplements do not replace prescribed diabetes management.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A client taking metformin develops acute dehydration and poor oral intake. What is the safest next step?\",\"options\":[\"Ignore the illness and continue unchanged without assessment\",\"Review sick-day medication instructions with the prescriber and assess renal function/hydration\",\"Double metformin to compensate for illness\",\"Stop glucose checks\"],\"correct\":1,\"feedback\":[\"Acute dehydration may impair kidney function and change medication safety.\",\"Metformin requires reassessment during significant acute illness or dehydration because of kidney-related accumulation risk.\",\"Doubling increases medication risk without treating dehydration.\",\"Illness can destabilize glucose; monitoring is important.\"]},{\"topic\":\"Osteoporosis\",\"stem\":\"A postmenopausal patient asks about raloxifene and has a history of DVT. Which action is safest?\",\"options\":[\"Give the medication without further review\",\"Flag the thromboembolic history and clarify the order\",\"Advise bed rest for several weeks\",\"Take the medication with a double calcium dose\"],\"correct\":1,\"feedback\":[\"Raloxifene can increase venous thromboembolism risk.\",\"A prior DVT is a major safety concern for estrogen agonist/antagonist therapy.\",\"Prolonged immobility may increase clot risk.\",\"Extra calcium does not prevent thromboembolic complications.\"]}],\"labs\":[{\"topic\":\"Thyroid\",\"stem\":\"TSH 16 mIU/L and free T4 below the reference range accompany fatigue and cold intolerance. Which interpretation fits best?\",\"options\":[\"Primary hypothyroidism\",\"Primary hyperthyroidism\",\"Thyroid storm\",\"Normal thyroid function\"],\"correct\":0,\"feedback\":[\"High TSH with low T4 reflects an underactive thyroid and compensatory pituitary stimulation.\",\"Primary hyperthyroidism typically suppresses TSH and elevates T4/T3.\",\"Thyroid storm presents with severe hypermetabolic instability, not this laboratory pattern.\",\"Both values are abnormal and align with the clinical findings.\"]},{\"topic\":\"Thyroid\",\"stem\":\"TSH 0.02 mIU/L and elevated free T4 accompany palpitations and heat intolerance. What is most likely?\",\"options\":[\"Primary hypothyroidism\",\"Primary hyperthyroidism\",\"Myxedema coma\",\"Normal thyroid function\"],\"correct\":1,\"feedback\":[\"Primary hypothyroidism generally has high TSH and low T4.\",\"Excess T4 suppresses pituitary TSH by negative feedback.\",\"Myxedema coma is severe thyroid hormone deficiency with hypometabolism.\",\"The hormone pattern and symptoms are not normal.\"]},{\"topic\":\"Liver\",\"stem\":\"Cirrhosis labs: albumin 2.2 g/dL and new peripheral edema. Which mechanism best explains the edema?\",\"options\":[\"Reduced oncotic pressure from impaired albumin synthesis\",\"Excess albumin production\",\"Increased thyroid hormone production\",\"Improved hepatic protein synthesis\"],\"correct\":0,\"feedback\":[\"Low albumin decreases plasma oncotic pressure, allowing fluid to move into interstitial spaces.\",\"Albumin is low, not excessive.\",\"Thyroid hormone production is not the direct explanation for this cirrhosis pattern.\",\"Improved synthesis would tend to raise albumin.\"]},{\"topic\":\"Liver\",\"stem\":\"A patient with cirrhosis has INR 2.8 and easy bruising. What is the priority interpretation?\",\"options\":[\"Improved clotting function\",\"Increased bleeding risk from impaired clotting factor production\",\"Isolated hypoglycemia\",\"Normal coagulation\"],\"correct\":1,\"feedback\":[\"A high INR does not indicate better coagulation.\",\"Liver dysfunction reduces synthesis of coagulation factors, prolonging PT/INR and increasing bleeding risk.\",\"Glucose changes do not explain prolonged INR.\",\"This INR is substantially prolonged.\"]},{\"topic\":\"Liver\",\"stem\":\"A patient with cirrhosis develops new confusion and asterixis. Ammonia is elevated. What should the nurse conclude?\",\"options\":[\"Hepatic encephalopathy is a concern; assess clinically\",\"Ammonia alone confirms severity and replaces neurologic assessment\",\"The patient is improving\",\"This is expected normal aging\"],\"correct\":0,\"feedback\":[\"Impaired hepatic toxin clearance can contribute to encephalopathy; mental status and neurologic examination remain essential.\",\"Ammonia levels do not reliably grade severity without clinical assessment.\",\"New confusion and asterixis are signs of deterioration.\",\"Acute confusion should not be attributed to aging.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Glucose 295 mg/dL, pH 7.18, bicarbonate 11 mEq/L, positive ketones. Which condition is most consistent?\",\"options\":[\"HHS without acidosis\",\"DKA\",\"Isolated mild hypoglycemia\",\"Stable Type 2 diabetes\"],\"correct\":1,\"feedback\":[\"HHS usually has minimal ketosis and no marked acidosis.\",\"Ketones plus low pH and bicarbonate indicate ketoacidosis even with glucose below extreme HHS levels.\",\"Glucose is elevated, not low.\",\"Metabolic acidosis requires urgent treatment.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Glucose 820 mg/dL, pH 7.38, high osmolality and profound confusion. Which syndrome is most likely?\",\"options\":[\"DKA with severe acidosis\",\"HHS\",\"Hypoglycemia\",\"Normal response to exercise\"],\"correct\":1,\"feedback\":[\"Marked acidosis and ketosis are not shown.\",\"Extreme hyperglycemia, hyperosmolality and neurologic changes with near-normal pH fit HHS.\",\"The glucose is critically high, not low.\",\"Exercise does not explain this severe hyperosmolar state.\"]},{\"topic\":\"Diabetes\",\"stem\":\"During DKA treatment potassium drops to 3.0 mEq/L. What is the key safety concern?\",\"options\":[\"Insulin may worsen hypokalemia and cause dysrhythmias\",\"Potassium cannot change with insulin\",\"The patient is fully recovered\",\"Elevated potassium is the only risk\"],\"correct\":0,\"feedback\":[\"Insulin shifts potassium intracellularly, potentially worsening a low serum level and provoking arrhythmia.\",\"Insulin substantially affects potassium distribution.\",\"Potassium depletion requires action even if glucose is improving.\",\"This patient has low potassium, not high.\"]},{\"topic\":\"Diabetes\",\"stem\":\"HbA1c is 9.4% in a patient with Type 2 diabetes. What does this most directly reflect?\",\"options\":[\"Glucose level only at the moment of testing\",\"Average glycemic exposure over about 2–3 months\",\"Current serum potassium concentration\",\"Presence of urinary ketones\"],\"correct\":1,\"feedback\":[\"Fingerstick glucose reflects a point in time, not HbA1c.\",\"Glycated hemoglobin estimates longer-term glucose exposure.\",\"HbA1c does not measure potassium.\",\"Ketones require separate assessment.\"]},{\"topic\":\"Liver\",\"stem\":\"A newborn has direct hyperbilirubinemia, pale stools and dark urine. Which condition should be investigated?\",\"options\":[\"Biliary atresia\",\"Hypothyroid myxedema coma\",\"Osteoporosis\",\"HHS\"],\"correct\":0,\"feedback\":[\"Obstructed bile flow causes conjugated bilirubin elevation, dark urine and acholic stools.\",\"Myxedema coma does not explain this cholestatic stool pattern.\",\"Osteoporosis is unrelated to neonatal bile obstruction.\",\"HHS is a diabetic hyperosmolar emergency, not neonatal cholestasis.\"]},{\"topic\":\"Liver\",\"stem\":\"A patient has reactive HCV antibody. Which test confirms current HCV infection?\",\"options\":[\"HBsAg\",\"HCV RNA\",\"Anti-HBs\",\"HAV IgG\"],\"correct\":1,\"feedback\":[\"HBsAg is a marker of current hepatitis B infection.\",\"HCV RNA detects circulating viral genetic material and confirms active infection.\",\"Anti-HBs indicates immunity to hepatitis B.\",\"HAV IgG indicates past hepatitis A infection or immunization.\"]},{\"topic\":\"Liver\",\"stem\":\"A patient has positive hepatitis B surface antigen (HBsAg). What does this marker indicate?\",\"options\":[\"Immunity from vaccination alone\",\"Current hepatitis B infection\",\"Resolved hepatitis A\",\"Confirmed current hepatitis C\"],\"correct\":1,\"feedback\":[\"Vaccination-related immunity is associated with anti-HBs, not HBsAg.\",\"HBsAg indicates a current HBV infection, acute or chronic depending on duration.\",\"HAV uses different serologic markers.\",\"HCV requires its own antibody and RNA testing.\"]}],\"compare\":[{\"topic\":\"Thyroid\",\"stem\":\"A patient has constipation, cold intolerance and bradycardia. Which condition is more consistent?\",\"options\":[\"Hypothyroidism\",\"Hyperthyroidism\",\"Thyroid storm\",\"Graves ophthalmopathy alone\"],\"correct\":0,\"feedback\":[\"Reduced thyroid hormone slows metabolism, GI motility and heart rate.\",\"Hyperthyroidism more often causes heat intolerance, tachycardia and loose stools.\",\"Thyroid storm produces severe fever and cardiovascular instability.\",\"Eye disease does not explain the full systemic pattern.\"]},{\"topic\":\"Thyroid\",\"stem\":\"Which condition is associated with exophthalmos, tremor and weight loss despite increased appetite?\",\"options\":[\"Hashimoto hypothyroidism\",\"Graves hyperthyroidism\",\"Myxedema coma\",\"Post-thyroidectomy hypocalcemia\"],\"correct\":1,\"feedback\":[\"Hashimoto disease generally produces hypothyroid findings.\",\"Graves disease can produce hypermetabolism and thyroid eye disease.\",\"Myxedema coma produces severe hypometabolism and reduced consciousness.\",\"Hypocalcemia causes paresthesias and tetany, not exophthalmos.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Which condition best matches gradual onset, profound hyperosmolality and minimal ketosis?\",\"options\":[\"DKA\",\"HHS\",\"Hypoglycemia\",\"Thyroid storm\"],\"correct\":1,\"feedback\":[\"DKA is characterized by ketones and metabolic acidosis.\",\"HHS commonly develops over days with marked dehydration and neurologic changes.\",\"Hypoglycemia involves low blood glucose.\",\"Thyroid storm is a thyroid emergency, not a hyperosmolar diabetes syndrome.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Which complication most directly results from absolute insulin deficiency and ketone accumulation?\",\"options\":[\"DKA\",\"HHS without ketones\",\"Diabetic retinopathy\",\"Peripheral arterial disease\"],\"correct\":0,\"feedback\":[\"Insulin deficiency promotes lipolysis, ketogenesis and metabolic acidosis.\",\"HHS typically retains enough insulin to suppress major ketogenesis.\",\"Retinopathy is a chronic microvascular complication.\",\"Peripheral arterial disease is a chronic macrovascular complication.\"]},{\"topic\":\"Liver\",\"stem\":\"Which finding indicates decompensated rather than compensated cirrhosis?\",\"options\":[\"No symptoms with stable laboratory findings\",\"New ascites and hepatic encephalopathy\",\"Normal bilirubin and no edema\",\"No clinical complications\"],\"correct\":1,\"feedback\":[\"Compensated disease may have no overt complications.\",\"Ascites and encephalopathy indicate loss of compensation.\",\"Absence of complications does not support decompensation.\",\"No clinical complications is the opposite of decompensation.\"]},{\"topic\":\"Liver\",\"stem\":\"Which hepatitis pair is primarily transmitted by the fecal–oral route?\",\"options\":[\"A and E\",\"B and D\",\"B and C\",\"C and D\"],\"correct\":0,\"feedback\":[\"Hepatitis A and E are associated with contaminated food or water.\",\"B and D are transmitted through blood/body fluids; D requires B.\",\"B and C are primarily blood/body-fluid related rather than fecal–oral.\",\"C is bloodborne and D is linked to HBV.\"]},{\"topic\":\"Liver\",\"stem\":\"Which hepatitis virus requires hepatitis B infection to replicate?\",\"options\":[\"Hepatitis A\",\"Hepatitis C\",\"Hepatitis D\",\"Hepatitis E\"],\"correct\":2,\"feedback\":[\"HAV does not require HBV coinfection.\",\"HCV is an independent infection.\",\"HDV requires HBV surface antigen for its lifecycle.\",\"HEV is primarily enterically transmitted and does not depend on HBV.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Which diabetes type is characterized by autoimmune beta-cell destruction and lifelong insulin need?\",\"options\":[\"Type 1 diabetes\",\"Type 2 diabetes only\",\"Gestational diabetes only\",\"Prediabetes\"],\"correct\":0,\"feedback\":[\"Autoimmune beta-cell loss causes absolute or near-absolute insulin deficiency in Type 1.\",\"Type 2 is primarily insulin resistance with progressive beta-cell dysfunction.\",\"Gestational diabetes develops during pregnancy and is not defined by autoimmune beta-cell destruction.\",\"Prediabetes does not describe autoimmune absolute insulin deficiency.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Which chronic complication is microvascular rather than macrovascular?\",\"options\":[\"Coronary artery disease\",\"Peripheral artery disease\",\"Diabetic retinopathy\",\"Stroke\"],\"correct\":2,\"feedback\":[\"Coronary disease involves large-vessel atherosclerotic pathology.\",\"Peripheral arterial disease is a macrovascular complication.\",\"Retinal microvessel injury causes diabetic retinopathy.\",\"Stroke is a cerebrovascular macrovascular complication.\"]},{\"topic\":\"Osteoporosis\",\"stem\":\"Which manifestation most strongly suggests vertebral compression fractures from osteoporosis?\",\"options\":[\"Progressive height loss and kyphosis\",\"Exophthalmos and palpitations\",\"Jaundice and ascites\",\"Polyuria and polydipsia\"],\"correct\":0,\"feedback\":[\"Compression fractures can reduce stature and produce kyphotic curvature.\",\"These findings suggest thyroid excess.\",\"These are liver dysfunction findings.\",\"These are glucose-related symptoms.\"]}],\"calc\":[{\"topic\":\"Diabetes\",\"stem\":\"Ordered correction scale: glucose 151–200 = 2 units; 201–250 = 4 units; 251–300 = 6 units. Premeal glucose is 238 mg/dL. How many correction units are indicated?\",\"options\":[\"2 units\",\"4 units\",\"6 units\",\"8 units\"],\"correct\":1,\"feedback\":[\"Two units apply only to 151–200 mg/dL.\",\"238 mg/dL lies in the 201–250 bracket, which specifies 4 units.\",\"Six units apply to 251–300 mg/dL.\",\"Eight units is not specified by this scale.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A prescribed insulin-to-carbohydrate ratio is 1 unit per 12 g carbohydrate. The meal contains 60 g. How many units of prandial insulin are prescribed?\",\"options\":[\"4 units\",\"5 units\",\"6 units\",\"12 units\"],\"correct\":1,\"feedback\":[\"Four units cover 48 g at this ratio.\",\"60 ÷ 12 = 5 units for the meal.\",\"Six units would cover 72 g.\",\"Twelve units would cover 144 g.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A patient is prescribed 6 units prandial insulin plus 3 units correction insulin before lunch. What total rapid-acting dose is ordered?\",\"options\":[\"3 units\",\"6 units\",\"9 units\",\"18 units\"],\"correct\":2,\"feedback\":[\"Three units accounts for correction only.\",\"Six units accounts for meal coverage only.\",\"6 + 3 = 9 units total; verify the combined order and meal availability.\",\"Eighteen units doubles the prescribed combined amount.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A conscious patient with glucose 58 mg/dL receives 15 g fast-acting carbohydrate at 10:10. When should glucose be rechecked?\",\"options\":[\"10:15\",\"10:25\",\"10:40\",\"11:10\"],\"correct\":1,\"feedback\":[\"Five minutes is earlier than the standard 15-minute reassessment.\",\"The 15–15 approach calls for reassessment 15 minutes after treatment: 10:25.\",\"Thirty minutes delays reassessment.\",\"One hour delays detection of persistent hypoglycemia.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A patient with glucose 64 mg/dL can swallow. A glucose product provides 4 g carbohydrate per tablet. Which whole-tablet dose is closest to 15 g?\",\"options\":[\"1 tablet\",\"2 tablets\",\"4 tablets\",\"8 tablets\"],\"correct\":2,\"feedback\":[\"One tablet supplies only 4 g.\",\"Two tablets supply only 8 g.\",\"Four tablets supply 16 g, close to the recommended ~15 g.\",\"Eight tablets supply 32 g, more than the initial recommended amount.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A prescribed correction factor is 1 unit per 50 mg/dL above a target of 150 mg/dL. Current glucose is 300 mg/dL. How many correction units does the prescribed formula yield?\",\"options\":[\"2 units\",\"3 units\",\"4 units\",\"6 units\"],\"correct\":1,\"feedback\":[\"Two units correct 100 mg/dL above target.\",\"(300 − 150) ÷ 50 = 3 units.\",\"Four units would correspond to a 200 mg/dL excess.\",\"Six units doubles the calculated dose.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A patient eats 45 g carbohydrate. Their prescribed ratio is 1 unit per 15 g. What is the meal dose?\",\"options\":[\"2 units\",\"3 units\",\"4 units\",\"5 units\"],\"correct\":1,\"feedback\":[\"Two units cover 30 g.\",\"45 ÷ 15 = 3 units.\",\"Four units cover 60 g.\",\"Five units cover 75 g.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A patient receives 5 units prandial plus 2 units correction. The pen displays units. What should be dialed for the combined ordered dose?\",\"options\":[\"2 units\",\"5 units\",\"7 units\",\"10 units\"],\"correct\":2,\"feedback\":[\"Two units omit meal coverage.\",\"Five units omit correction coverage.\",\"5 + 2 = 7 units total.\",\"Ten units exceeds the combined prescription.\"]},{\"topic\":\"Diabetes\",\"stem\":\"At 14:00 a patient with glucose 66 mg/dL takes 15 g glucose. At 14:15 glucose is 68 mg/dL and the patient remains awake and able to swallow. What is the next action?\",\"options\":[\"Repeat approximately 15 g carbohydrate and recheck in 15 minutes\",\"Give the scheduled rapid insulin now\",\"Wait until dinner\",\"Start vigorous exercise\"],\"correct\":0,\"feedback\":[\"Glucose remains below 70, so the 15–15 protocol calls for repeat treatment and reassessment.\",\"Insulin would worsen hypoglycemia.\",\"Delaying treatment risks worsening neuroglycopenia.\",\"Exercise may further lower glucose.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A correction order specifies 1 unit for each complete 40 mg/dL above 140 mg/dL, rounding down to a whole unit. Glucose is 260 mg/dL. How many units are prescribed?\",\"options\":[\"2 units\",\"3 units\",\"4 units\",\"5 units\"],\"correct\":1,\"feedback\":[\"Two units cover 80 mg/dL above target.\",\"(260 − 140) ÷ 40 = 3 complete increments.\",\"Four units would require 160 mg/dL above target.\",\"Five units would require 200 mg/dL above target.\"]}],\"teaching\":[{\"topic\":\"Thyroid\",\"stem\":\"Which patient statement requires correction after levothyroxine teaching?\",\"options\":[\"I will take it before breakfast on an empty stomach.\",\"I will tell my clinician about palpitations or tremors.\",\"I can stop it as soon as I feel normal.\",\"I will ask about interactions with my other medicines.\"],\"correct\":2,\"feedback\":[\"This supports consistent absorption.\",\"These symptoms may indicate excessive replacement and merit assessment.\",\"Symptom relief does not mean thyroid hormone production has recovered; therapy is often lifelong.\",\"Drug interactions can alter levothyroxine effectiveness.\"]},{\"topic\":\"Thyroid\",\"stem\":\"A patient receiving methimazole says, “I will call if I get a fever or sore throat.” What is the response?\",\"options\":[\"Correct; these can be warning signs of agranulocytosis.\",\"Incorrect; fever is always harmless with this drug.\",\"Incorrect; only weight gain needs reporting.\",\"Incorrect; take extra methimazole when ill.\"],\"correct\":0,\"feedback\":[\"Fever or sore throat can indicate dangerous neutropenia and infection.\",\"These symptoms require prompt assessment.\",\"Weight changes are not the only relevant medication safety issue.\",\"Dose escalation is unsafe without an order.\"]},{\"topic\":\"Liver\",\"stem\":\"A patient with cirrhosis and ascites says, “I will use salty processed foods to maintain my weight.” What should the nurse teach?\",\"options\":[\"Sodium restriction may help reduce fluid retention; choose a high-calorie, adequate-protein plan as directed.\",\"Increase sodium because it removes ascitic fluid.\",\"Avoid all protein indefinitely.\",\"Stop monitoring weight and abdominal girth.\"],\"correct\":0,\"feedback\":[\"Sodium restriction helps manage ascites; adequate calories and protein support nutrition unless individualized otherwise.\",\"Excess sodium worsens fluid retention.\",\"Routine protein restriction risks malnutrition and is not generally advised.\",\"Daily weights and girth help track fluid status.\"]},{\"topic\":\"Liver\",\"stem\":\"Which teaching is appropriate for a person with hepatitis A?\",\"options\":[\"Wash hands thoroughly after toileting and before preparing food.\",\"Share food without hand hygiene because transmission is only bloodborne.\",\"Stop all fluid intake.\",\"Assume the infection is always chronic.\"],\"correct\":0,\"feedback\":[\"HAV spreads by fecal–oral contamination; hand hygiene reduces transmission.\",\"HAV is not primarily bloodborne.\",\"Hydration is important when nausea and vomiting occur.\",\"HAV causes acute infection rather than chronic hepatitis.\"]},{\"topic\":\"Liver\",\"stem\":\"A patient with hepatitis C says, “I should share needles if I feel well.” What is the best response?\",\"options\":[\"Avoid sharing needles or blood-contaminated equipment even without symptoms.\",\"HCV spreads only after jaundice develops.\",\"A vaccine prevents all HCV transmission.\",\"HCV antibody alone always proves current infection.\"],\"correct\":0,\"feedback\":[\"HCV can transmit through blood even when the person is asymptomatic.\",\"Many HCV infections are asymptomatic.\",\"There is no hepatitis C vaccine.\",\"RNA testing confirms current viremia after screening.\"]},{\"topic\":\"Osteoporosis\",\"stem\":\"Which statement needs correction after alendronate teaching?\",\"options\":[\"I will take it with a full glass of water.\",\"I will remain upright after the dose.\",\"I will take it with milk and return to bed.\",\"I will report painful swallowing.\"],\"correct\":2,\"feedback\":[\"Water supports appropriate oral administration.\",\"Remaining upright reduces esophageal exposure.\",\"Milk reduces absorption and lying down increases esophageal injury risk.\",\"Odynophagia may indicate esophagitis and needs evaluation.\"]},{\"topic\":\"Osteoporosis\",\"stem\":\"Which home plan best reduces osteoporotic fracture risk?\",\"options\":[\"Weight-bearing activity as tolerated and fall prevention\",\"Avoid all activity and remain in bed\",\"Use loose rugs to cushion falls\",\"Increase tobacco use\"],\"correct\":0,\"feedback\":[\"Activity can help preserve bone and balance while fall prevention reduces injury.\",\"Immobility contributes to bone loss and weakness.\",\"Loose rugs are tripping hazards.\",\"Smoking adversely affects bone health.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A Type 1 patient says, “When sick and not eating, I will stop all basal insulin.” Which teaching is best?\",\"options\":[\"Continue an individualized basal insulin plan and monitor glucose/ketones as instructed.\",\"Stopping basal insulin prevents DKA.\",\"Never check glucose while ill.\",\"Exercise vigorously when ketones are high.\"],\"correct\":0,\"feedback\":[\"Basal insulin is needed to suppress ketogenesis even when meals are missed; dosing should follow sick-day instructions.\",\"Insulin omission can trigger DKA.\",\"Illness increases the need for monitoring.\",\"Exercise with significant ketosis can worsen metabolic instability.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A patient with diabetes says, “I walk barefoot indoors because I can see the floor.” What is the best teaching?\",\"options\":[\"Wear properly fitting shoes and inspect feet daily.\",\"Bare feet are safe when neuropathy is present.\",\"Use a heating pad directly on numb feet.\",\"Ignore small foot wounds until they hurt.\"],\"correct\":0,\"feedback\":[\"Protective footwear and inspection reduce unnoticed injury when sensation is impaired.\",\"Neuropathy increases risk of unrecognized trauma.\",\"Reduced sensation increases burn risk from heat.\",\"Poor healing and infection can progress before pain occurs.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A patient with symptomatic glucose 61 mg/dL is alert and able to swallow. Which self-care statement is correct?\",\"options\":[\"Take about 15 g of fast-acting carbohydrate and recheck in 15 minutes.\",\"Take the next insulin dose immediately to correct the low.\",\"Wait several hours without eating.\",\"Drive to the pharmacy before treating symptoms.\"],\"correct\":0,\"feedback\":[\"The 15–15 approach treats mild-to-moderate hypoglycemia when swallowing is safe.\",\"Additional insulin would lower glucose further.\",\"Untreated hypoglycemia can progress to neuroglycopenia.\",\"Driving while symptomatic is unsafe.\"]},{\"topic\":\"Diabetes\",\"stem\":\"A patient asks how to reduce long-term diabetes complications. Which plan is best?\",\"options\":[\"Regular eye and kidney screening plus glucose, blood pressure and foot care\",\"Only check glucose when feeling ill\",\"Stop physical activity permanently\",\"Ignore changes in vision\"],\"correct\":0,\"feedback\":[\"Multifactorial prevention and screening address microvascular, macrovascular and neuropathic risks.\",\"Asymptomatic hyperglycemia can still cause harm.\",\"Activity generally improves insulin sensitivity when safe.\",\"Visual changes may reflect retinopathy and require assessment.\"]},{\"topic\":\"Liver\",\"stem\":\"Parents of an infant with persistent jaundice say, “Pale stools are normal after two weeks.” Which reply is best?\",\"options\":[\"Pale stools and persistent jaundice need prompt evaluation for biliary obstruction.\",\"Wait until school age for assessment.\",\"Dark urine rules out liver disease.\",\"Only vomiting matters for biliary atresia.\"],\"correct\":0,\"feedback\":[\"Acholic stools and prolonged jaundice can signal biliary atresia; timely diagnosis affects treatment.\",\"Delay risks progressive cholestatic injury.\",\"Dark urine can occur with conjugated hyperbilirubinemia.\",\"Biliary atresia often presents with jaundice and abnormal stool/urine color.\"]}],\"sim\":[{\"title\":\"DKA: Stabilize, Monitor, Reassess\",\"topic\":\"Diabetes\",\"intro\":\"A 22-year-old with Type 1 diabetes missed insulin during a febrile illness. Glucose 490 mg/dL, pH 7.20, bicarbonate 12, positive ketones, dry mucous membranes.\",\"steps\":[{\"topic\":\"Diabetes\",\"stem\":\"Stage 1 — The patient is tachycardic and dehydrated. Which initial priority is most appropriate?\",\"options\":[\"Assess circulation, begin ordered isotonic IV fluids and obtain electrolytes\",\"Give an oral snack and discharge\",\"Start strenuous exercise\",\"Wait for HbA1c before treatment\"],\"correct\":0,\"feedback\":[\"Osmotic diuresis causes major fluid losses; perfusion, fluid replacement and potassium assessment are early priorities.\",\"This patient has a metabolic emergency and cannot be discharged after a snack.\",\"Exercise with ketosis can worsen illness.\",\"HbA1c is not needed before acute stabilization.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Stage 2 — Before starting IV insulin, potassium returns at 2.9 mEq/L. What is safest?\",\"options\":[\"Begin insulin immediately without addressing potassium\",\"Notify provider and anticipate potassium replacement before insulin\",\"Restrict all IV fluids\",\"Give additional correction insulin subcutaneously\"],\"correct\":1,\"feedback\":[\"Insulin can shift potassium into cells and worsen dangerous hypokalemia.\",\"Potassium is critically low; replacing it before insulin helps prevent dysrhythmias.\",\"Fluid resuscitation is still needed, tailored to patient status.\",\"Additional insulin could aggravate hypokalemia.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Stage 3 — After treatment, glucose is 225 mg/dL but pH is 7.25 and ketones remain positive. What should the nurse anticipate?\",\"options\":[\"Stop insulin because glucose is below 250\",\"Continue ordered insulin with dextrose-containing fluids and electrolyte monitoring\",\"Discharge because glucose improved\",\"Hold all glucose monitoring\"],\"correct\":1,\"feedback\":[\"Stopping insulin before ketosis resolves risks persistent DKA.\",\"Dextrose helps prevent hypoglycemia while insulin continues to clear ketones and acidosis.\",\"Acidosis remains unresolved.\",\"Frequent glucose and electrolyte checks remain essential.\"]}]},{\"title\":\"Thyroidectomy: Airway and Calcium\",\"topic\":\"Thyroid\",\"intro\":\"A patient is recovering from a total thyroidectomy. The nurse monitors neck swelling, voice, breathing and calcium-related symptoms.\",\"steps\":[{\"topic\":\"Thyroid\",\"stem\":\"Stage 1 — New neck fullness and stridor develop. What is the first action?\",\"options\":[\"Activate airway assistance and assess for hematoma\",\"Offer oral water\",\"Place flat and wait\",\"Provide routine discharge instructions\"],\"correct\":0,\"feedback\":[\"Neck swelling with stridor suggests impending airway obstruction from bleeding or edema.\",\"Oral intake risks aspiration and delays emergency management.\",\"Supine positioning and delay can worsen airway compromise.\",\"Teaching is secondary to airway stabilization.\"]},{\"topic\":\"Thyroid\",\"stem\":\"Stage 2 — After stabilization, the patient reports perioral tingling and hand spasms. What should be assessed?\",\"options\":[\"Serum calcium and signs of tetany\",\"HbA1c only\",\"Hepatitis C antibody\",\"Bone density score\"],\"correct\":0,\"feedback\":[\"Parathyroid injury can cause hypocalcemia and neuromuscular irritability after thyroidectomy.\",\"Long-term glycemia does not explain acute tetany.\",\"Hepatitis screening does not address the symptoms.\",\"Bone density is not the immediate postoperative test.\"]},{\"topic\":\"Thyroid\",\"stem\":\"Stage 3 — Which finding best supports a stable recovery before routine teaching?\",\"options\":[\"No respiratory distress and no progressive neck swelling\",\"New inspiratory stridor\",\"Increasing neck hematoma\",\"Worsening carpopedal spasms\"],\"correct\":0,\"feedback\":[\"A patent airway without progressive swelling indicates stabilization of the major immediate postoperative threat.\",\"Stridor suggests obstruction.\",\"Expanding hematoma threatens the airway.\",\"Worsening spasms suggest untreated hypocalcemia.\"]}]},{\"title\":\"Cirrhosis: Varices to Encephalopathy\",\"topic\":\"Liver\",\"intro\":\"A patient with decompensated cirrhosis has ascites and known portal hypertension.\",\"steps\":[{\"topic\":\"Liver\",\"stem\":\"Stage 1 — The patient vomits a large amount of bright red blood and becomes hypotensive. What is priority?\",\"options\":[\"Emergency response, airway/perfusion assessment and bleeding management\",\"Offer a high-fiber meal\",\"Schedule routine outpatient endoscopy\",\"Encourage independent walking\"],\"correct\":0,\"feedback\":[\"Ruptured varices can cause rapid blood loss and shock; stabilization is immediate.\",\"Food is unsafe during active hematemesis.\",\"Outpatient follow-up is inappropriate in hemorrhagic shock.\",\"Walking risks collapse.\"]},{\"topic\":\"Liver\",\"stem\":\"Stage 2 — After stabilization, the patient becomes disoriented with asterixis. What complication is suspected?\",\"options\":[\"Hepatic encephalopathy\",\"Osteoporosis\",\"Hyperthyroidism\",\"Isolated dehydration without assessment\"],\"correct\":0,\"feedback\":[\"Impaired hepatic toxin clearance can cause altered mental status and asterixis.\",\"Bone density loss does not explain acute neurologic changes.\",\"Hyperthyroidism does not account for the cirrhosis-associated pattern.\",\"Dehydration may contribute, but the syndrome requires full encephalopathy assessment.\"]},{\"topic\":\"Liver\",\"stem\":\"Stage 3 — Lactulose is ordered. Which finding supports effectiveness?\",\"options\":[\"Two to three soft stools daily and improving orientation\",\"No bowel movements for three days\",\"Ten watery stools with hypotension\",\"Progressive confusion\"],\"correct\":0,\"feedback\":[\"Target stool frequency and improved mentation suggest ammonia elimination and response.\",\"Constipation suggests inadequate stool elimination.\",\"Profuse diarrhea risks dehydration and electrolyte disturbances.\",\"Worsening confusion suggests ineffective treatment or another cause.\"]}]},{\"title\":\"HHS: Fluids, Neurology, Reassessment\",\"topic\":\"Diabetes\",\"intro\":\"A 74-year-old with Type 2 diabetes has glucose 790 mg/dL, marked dehydration, high osmolality, pH 7.37 and confusion.\",\"steps\":[{\"topic\":\"Diabetes\",\"stem\":\"Stage 1 — What is the priority nursing focus?\",\"options\":[\"Assess perfusion and start prescribed IV fluid resuscitation with close monitoring\",\"Give oral candy for hypoglycemia\",\"Wait for urine ketones before any action\",\"Encourage exercise\"],\"correct\":0,\"feedback\":[\"HHS causes profound water loss and hypoperfusion; fluid replacement and assessment are essential.\",\"This is severe hyperglycemia, not hypoglycemia.\",\"Resuscitation should not be delayed pending ketone results.\",\"Exercise is unsafe with dehydration and confusion.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Stage 2 — During therapy, what requires close ongoing monitoring?\",\"options\":[\"Mental status, glucose, electrolytes and intake/output\",\"Only weight at discharge\",\"Only HbA1c next year\",\"Only dietary preferences\"],\"correct\":0,\"feedback\":[\"Rapid shifts in osmolality, glucose and potassium can cause treatment complications.\",\"Discharge weight alone misses acute changes.\",\"HbA1c does not monitor immediate treatment.\",\"Diet matters later but not as the sole acute monitor.\"]},{\"topic\":\"Diabetes\",\"stem\":\"Stage 3 — Which trend most strongly suggests HHS improvement?\",\"options\":[\"Improving orientation and osmolality with better perfusion\",\"Increasing confusion and hypotension\",\"Worsening dehydration\",\"Falling urine output and new dysrhythmia\"],\"correct\":0,\"feedback\":[\"HHS recovery involves restored volume status, falling osmolality and neurologic improvement.\",\"These indicate deterioration.\",\"Worsening fluid loss opposes recovery.\",\"Renal and rhythm changes are warning signs.\"]}]}]};\nconst META={priority:['Who Do You See First?','Prioritize unstable patients using ABCs and acute changes.'],meds:['Medication Safety Challenge','Administer, clarify, monitor, and recognize adverse effects.'],labs:['Lab Detective','Connect laboratory trends with urgent clinical meaning.'],sim:['Clinical Decision Simulator','Four unfolding patient cases, three decision stages each.'],compare:['Compare & Contrast','Differentiate conditions with similar presentations.'],calc:['Insulin & Medication Calculations','Practice order-based insulin calculations and 15–15 timing.'],teaching:['Discharge Teaching: Spot the Mistake','Identify unsafe patient statements and teach-back needs.']};\nconst KEY='nur223_exam5_day1_challenges_v1';let progress={};try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){progress={}};\nlet game=null,filter='All',caseId=0;\nconst $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}}\nfunction answered(k){return Object.prototype.hasOwnProperty.call(progress,k)}\nfunction gameCount(g){return g==='sim'?GAMES.sim.reduce((a,c)=>a+c.steps.length,0):GAMES[g].length}\nfunction gameDone(g){let n=0;if(g==='sim'){GAMES.sim.forEach((c,ci)=>c.steps.forEach((s,si)=>{if(answered(`sim:${ci}:${si}`))n++}))}else{GAMES[g].forEach((q,i)=>{if(answered(`${g}:${i}`))n++})}return n}\nfunction showHome(){game=null;let total=Object.keys(META).reduce((a,g)=>a+gameCount(g),0),done=Object.keys(META).reduce((a,g)=>a+gameDone(g),0);$('app').innerHTML=`<div class=\"hero\"><h1>Day 1 · Clinical Challenges</h1><p>Seven new study games using the Day 1 lecture topics: thyroid disorders, liver disease, osteoporosis and diabetes. Multiple-choice feedback is immediate; every answer choice has a clinical explanation.</p><div cla tes removal of ammonia through the gastrointestinal tract.\"], [\"Elevated ammonia may accompany symptoms\", 1, \"Impaired hepatic detoxification can raise circulating ammonia.\"], [\"Monitor mental status for deterioration\", 1, \"Worsening cognition can indicate progressing encephalopathy.\"], [\"Identify triggers such as GI bleeding\", 1, \"Bleeding can increase nitrogen load and precipitate encephalopathy.\"]]]];\nlet compareSet=0,compareSelected=null,comparePlacements={};\nfunction compareKey(){return 'compare-dnd:'+compareSet}\nfunction compareLoad(){let p=progress[compareKey()];comparePlacements=(p&&typeof p==='object'&&!Array.isArray(p))?{...p}:{}}\nfunction compareSave(){progress[compareKey()]={...comparePlacements};save()}\nfunction compareLabels(set){return Array.isArray(set[1])?set[1]:[set[1],set[2]]}\nfunction compareCards(set){return Array.isArray(set[1])?set[2]:set[3]}\nfunction compareScore(){return compareCards(COMPARE_SETS[compareSet]).filter((c,i)=>comparePlacements[i]===c[1]).length}\nfunction compareTile(i){let c=compareCards(COMPARE_SETS[compareSet])[i],p=comparePlacements[i],correct=p===c[1];return `<button type=\"button\" draggable=\"${p===undefined?'true':'false'}\" class=\"compare-tile ${p!==undefined?(correct?'correct':'wrong'):''} ${compareSelected===i?'selected':''}\" data-tile=\"${i}\" onclick=\"compareSelect(${i})\" ondragstart=\"compareDrag(event,${i})\"><b>${esc(c[0])}</b>${p!==undefined?`<small>${correct?'✓ Correct: ':'✕ Try again: '}${esc(c[2])}</small>`:''}</button>`}\nfunction renderCompare(){compareLoad();let set=COMPARE_SETS[compareSet],cards=compareCards(set),labels=compareLabels(set),placed=Object.keys(comparePlacements).length,correct=compareScore();$('app').innerHTML=`<a href=\"#\" class=\"toplink\" onclick=\"event.preventDefault();showHome()\">← All clinical challenges</a><div class=\"hero\"><h1>Compare & Contrast — Drag & Drop</h1><p>Drag each clinical finding into the condition it best matches. On a phone or tablet, tap tile===i));let m=$('compare-msg');if(m)m.textContent='Selected: '+compareCards(COMPARE_SETS[compareSet])[i][0]+'. Now tap the matching condition.'}\nfunction comparePlaceSelected(side){if(compareSelected!==null)comparePlace(compareSelected,side)}\nfunction comparePlace(i,side){let c=compareCards(COMPARE_SETS[compareSet])[i];if(comparePlacements[i]!==undefined)return;compareSelected=null;if(side===c[1]){comparePlacements[i]=side;compareSave();renderCompare();let m=$('compare-msg');if(m)m.textContent='Correct: '+c[0]+'. '+c[2]}else{let m=$('compare-msg');if(m)m.textContent='Not quite: '+c[0]+'. '+c[2]+' Try the other condition.';let tile=document.querySelector('[data-tile=\"'+i+'\"]');if(tile){tile.classList.add('wrong');setTimeout(()=>tile.classList.remove('wrong'),600)}}}\nfunction compareDrag(ev,i){if(comparePlacements[i]!==undefined){ev.preventDefault();return}ev.dataTransfer.setData('text/plain',String(i));ev.dataTransfer.effectAllowed='move'}\nfunction compareOver(ev){ev.preventDefault();ev.currentTarget.classList.add('over')}\nfunction compareLeave(ev){ev.currentTarget.classList.remove('over')}\nfunction compareDrop(ev,side){ev.preventDefault();ev.stopPropagation();ev.currentTarget.classList.remove('over');let n=Number(ev.dataTransfer.getData('text/plain'));if(Number.isInteger(n)&&n>=0&&n<compareCards(COMPARE_SETS[compareSet]).length)comparePlace(n,side)}\nfunction compareDropBank(ev){ev.preventDefault()}\nfunction compareReset(){if(!confirm('Reset this comparison?'))return;delete progress[compareKey()];save();compareSelected=null;renderCompare()}\n\nfunction openGame(g){game=g;filter='All';caseId=0;renderGame();window.scrollTo({top:0,behavior:'instant'})}\nfunction renderGame(){if(!game){showHome();return}let [name,desc]=META[game],done=gameDone(game),total=gameCount(game);let back=`<a href=\"#\" class=\"toplink\" onclick=\"event.preventDefault();showHome()\">← All clinical challenges</a>`;if(game==='sim'){renderSim(back);return}if(game==='compare'){renderCompare();return}let items=GAMES[game].map((q,i)=>({...q,i})).filter(q=>filter==='All'||q.topic===filter);$('app').innerHTML=`${back}<div class=\"hero\"><h1>${esc(name)}</h1><p>${esc(desc)}</p><div class=\"chip\">${done} / ${total} completed</div><div class=\"controls\"><label for=\"topic\">Topic</label><select id=\"topic\" onchange=\"filter=this.value;renderGame()\"><option>All</option>${['Thyroid','Liver','Osteoporosis','Diabetes'].map(t=>`<option ${t===filter?'selected':''}>${t}</option>`).join('')}</select><button class=\"secondary\" onclick=\"resetGame()\">Reset this game</button></div><div class=\"bar\"><div style=\"width:${100*done/total}%\"></div></div></div><div id=\"questions\">${items.length?items.map(q=>card(game,q.i,q)).join(''):'<div class=\"panel\">No questions in this topic for this game. Choose another topic.</div>'}</div>`}\nfunction card(g,i,q){let key=`${g}:${i}`,a=progress[key],has=answered(key),ok=has&&a===q.correct;return `<article class=\"panel qcard\" id=\"card-${g}-${i}\"><div class=\"muted\">Question ${i+1} of ${GAMES[g].length} · ${esc(q.topic)} ${has?'· Answered':''}</div><h3>${esc(q.stem)}</h3>${q.options.map((o,j)=>`<button class=\"option ${has?(j===q.correct?'correct':j===a?'wrong':''):''}\" ${has?'disabled':''} onclick=\"choose('${g}',${i},${j})\">${'ABCD'[j]}. ${esc(o)}</button>`).join('')}${has?explain(q,a,ok):''}</article>`}\nfunction explain(q,a,ok){return `<div class=\"feedback ${ok?'good':'bad'}\" role=\"status\"><strong>${ok?'Correct clinical decision':'Review this clinical decision'}</strong><p><b>Best answer:</b> ${esc(q.options[q.correct])}</p><p><b>Why each choice matters:</b></p>${q.options.map((o,j)=>`<p><b>${'ABCD'[j]} · ${j===q.correct?'Best answer':'Not the best answer'}:</b> ${esc(q.feedback[j])}</p>`).join('')}</div>`}\nfunction choose(g,i,j){let k=`${g}:${i}`;if(answered(k))return;progress[k]=j;save();let q=GAMES[g][i],node=$(`card-${g}-${i}`);node.outerHTML=card(g,i,q);let tag=document.querySelector('.hero .chip');if( led':''} onclick=\"chooseSim(${ci},${si},${j})\">${'ABCD'[j]}. ${esc(o)}</button>`).join('')}${has?explain(q,a,a===q.correct):''}</section>`}\nfunction chooseSim(ci,si,j){let k=`sim:${ci}:${si}`;if(answered(k))return;progress[k]=j;save();let current=document.getElementById(`sim-${ci}-${si}`);current.outerHTML=simCard(ci,si,GAMES.sim[ci].steps[si]);if(si+1<GAMES.sim[ci].steps.length){let next=document.getElementById(`sim-${ci}-${si+1}`);next.outerHTML=simCard(ci,si+1,GAMES.sim[ci].steps[si+1])}let chip=document.querySelector('.hero .chip');if(chip)chip.textContent=`${gameDone('sim')} / ${gameCount('sim')} decisions completed`;let bar=document.querySelector('.hero .bar>div');if(bar)bar.style.width=(100*gameDone('sim')/gameCount('sim'))+'%'}\nshowHome();\n<\/script><\\/body><\\/html>";
