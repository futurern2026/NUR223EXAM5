omotion", "stem": "A community nurse organizes blood-pressure screenings at a neighborhood event. This is an example of which approach?", "options": ["Health promotion and early identification of risk", "Tertiary acute care", "A replacement for all primary care", "An intervention only for symptomatic people"], "answer": 0, "why": "Community screening supports prevention and identification of risks before complications develop.", "wrong": []}, {"cat": "Promotion", "stem": "A client asks why health screenings matter when they feel healthy. Which response is best?", "options": ["Screenings identify potential problems before symptoms occur", "Only people with symptoms need screenings", "Screenings eliminate every future disease risk", "Screening recommendations are identical for everyone"], "answer": 0, "why": "Preventive screenings may detect risk factors or disease early; recommendations vary with age and individual risk.", "wrong": []}, {"cat": "Promotion", "stem": "A client cannot afford transportation to preventive appointments. What should the nurse assess?", "options": ["Whether the client is motivated enough", "Available community transportation and access resources", "Whether the client can be discharged from care", "Whether the client will promise to attend"], "answer": 1, "why": "Addressing access barriers and social determinants supports equitable prevention.", "wrong": []}, {"cat": "Education", "stem": "A client repeats insulin instructions correctly but cannot demonstrate use of the pen. Which action is best?", "options": ["Mark teaching complete", "Ask the client to demonstrate the procedure and correct errors", "Give the client a longer printed packet only", "Ask the family to perform it permanently"], "answer": 1, "why": "Psychomotor learning is verified through return demonstration, not verbal recall alone.", "wrong": []}, {"cat": "Education", "stem": "A client has severe pain and is distracted during discharge education. What should the nurse do?", "options": ["Continue because the handout is available", "Address pain and choose a better teaching time", "Test the client immediately", "Provide all teaching to a visitor"], "answer": 1, "why": "Pain and distraction hinder learning; readiness and comfort affect comprehension.", "wrong": []}, {"cat": "Education", "stem": "Which technique best confirms that a client understands a new medication schedule?", "options": ["Ask if they have any questions", "Ask them to explain the schedule in their own words", "Give a handout without discussion", "Ask them to nod when finished"], "answer": 1, "why": "Teach-back verifies understanding and reveals gaps the nurse can address.", "wrong": []}, {"cat": "Education", "stem": "A nurse teaches a client with low health literacy. Which approach is most appropriate?", "options": ["Use complex terminology to promote independence", "Use plain language, small sections, and teach-back", "Provide every detail in one long session", "Avoid pictures because they are childish"], "answer": 1, "why": "Plain language, manageable information, and teach-back support health literacy.", "wrong": []}, {"cat": "Education", "stem": "A client says they learn best by practicing a new skill. Which teaching method is best?", "options": ["Return demonstration with coaching", "A lecture without practice", "A list of unfamiliar terminology", "A written examination only"], "answer": 0, "why": "Hands-on practice addresses the psychomotor domain and lets the nurse correct technique.", "wrong": []}, {"cat": "Education", "stem": "A nurse is developing a client teaching plan. Which sequence is most appropriate?", "options": ["Implementation, planning, assessment, evaluation", "Assessment, analysis, planning, implementation, evaluation", "Evaluation, implementation, assessment, planning", "Planning, implementation, evaluation, assessment"], "answer": 1, "why": "An effective teaching plan begins with assessing needs and readiness and ends with evaluating learning.", "wrong": []}, {"cat": "Education", "stem": "A client says, “I want to learn, but I’m afraid I will fail.” What should the nurse do?", "options": ["Provide nonjudgmental encouragement and manageable practice", "Tell the client fear is irrational", "Postpone teaching indefinitely", "Give a difficult test first"], "answer": 0, "why": "Supportive feedback and realistic steps reduce anxiety and improve readiness.", "wrong": []}, {"cat": "CAM", "stem": "A client wants to start an herbal supplement while taking prescription medications. What is the nurse’s priority?", "options": ["Assure the client all natural products are safe", "Assess the product and check for interactions with the care team", "Tell the client to stop all prescribed drugs", "Ignore supplements because they are not medications"], "answer": 1, "why": "Supplements may have adverse effects and interactions; a medication history should include nonprescription products.", "wrong": []}, {"cat": "CAM", "stem": "A client asks about using meditation to reduce stress alongside prescribed treatment. Which response is best?", "options": ["Meditation can be discussed as a complementary strategy, not a replacement for indicated treatment", "Meditation cures all chronic illnesses", "Complementary strategies must never be discussed", "The client should discontinue treatment first"], "answer": 0, "why": "Complementary care is used alongside conventional care when safe and consistent with client preferences.", "wrong": []}, {"cat": "CAM", "stem": "A client asks whether acupuncture is a conventional medical treatment. Which answer is accurate?", "options": ["It is an example of a complementary or alternative therapy", "It is the same as antibiotic therapy", "It is a type of electronic health record", "It is a screening program"], "answer": 0, "why": "The lecture identifies acupuncture among alternative therapies.", "wrong": []}, {"cat": "CAM", "stem": "A client asks about massage and reflexology. What should the nurse do before arranging a session?", "options": ["Assess client preferences, condition, and possible contraindications", "Promise there are no risks", "Replace ordered medications with massage", "Assume the client wants the therapy"], "answer": 0, "why": "Client-centered integrative care requires assessment of suitability and preferences.", "wrong": []}, {"cat": "Ethics", "stem": "A client chooses not to undergo surgery despite the nurse’s concerns. Which principle is most directly involved?", "options": ["Justice", "Autonomy", "Fidelity", "Veracity"], "answer": 1, "why": "Autonomy protects a capable client’s right to make personal healthcare decisions.", "wrong": []}, {"cat": "Ethics", "stem": "A nurse questions a medication order that could harm an unstable client. Which ethical principle is demonstrated?", "options": ["Nonmaleficence", "Justice", "Fidelity", "Autonomy"], "answer": 0, "why": "Nonmaleficence is the duty to avoid harm; clarifying a potentially unsafe order supports that duty.", "wrong": []}, {"cat": "Ethics", "stem": "A nurse provides accurate information about an error rather than hiding it. Which principle is most relevant?", "options": ["Veracity", "Autonomy", "Justice", "Beneficence"], "answer": 0, "why": "Veracity is the obligation to tell the truth.", "wrong": []}, {"cat": "Ethics", "stem": "A nurse distributes limited resources using the same clinical criteria for every client. Which principle is demonstrated?", "options": ["Fidelity", "Justice", "Veracity", "Autonomy"], "answer": 1, "why": "Justice concerns fairness in care and distribution of resources.", "wrong": []}, {"cat": "Ethics", "stem": "A nurse follows through on a promise to return with the client’s requested information. Which principle is illustrated?", "options": ["Nonmaleficence", "Fidelity", "Justice", "Autonomy"], "answer": 1, "why": "Fidelity involves keeping commitments and promises.", "wrong": []}, {"cat": "Ethics", "stem": "A nurse offers comfort measures before a painful activity , {"cat": "Privacy", "stem": "A nurse is preparing to discuss a sensitive diagnosis. Which location is best?", "options": ["A private area where the conversation cannot be overheard", "A crowded elevator", "The unit hallway", "A public cafeteria"], "answer": 0, "why": "Confidential communication requires limiting unnecessary disclosure to others.", "wrong": []}, {"cat": "Informatics", "stem": "A clinical decision support alert warns of a medication interaction. What should the nurse do?", "options": ["Use clinical judgment to evaluate the alert and verify the order", "Ignore every alert", "Assume the software replaces nursing assessment", "Administer without reviewing the warning"], "answer": 0, "why": "Clinical decision support provides guidance but does not replace nursing judgment or safety checks.", "wrong": []}, {"cat": "Informatics", "stem": "During barcode medication scanning, the system flags the wrong client. What is the best action?", "options": ["Override the alert to save time", "Stop and verify the client, medication, and order", "Scan another client’s wristband", "Skip documentation"], "answer": 1, "why": "Barcode scanning helps prevent errors; a mismatch requires investigation before administration.", "wrong": []}, {"cat": "Informatics", "stem": "A nurse needs to correct an inaccurate electronic note. What is the appropriate action?", "options": ["Delete the original entry without a trace", "Follow facility policy for a dated, attributable correction", "Use a colleague’s credentials", "Change the record to hide the error"], "answer": 1, "why": "Corrections must preserve an accurate, auditable clinical record.", "wrong": []}, {"cat": "Informatics", "stem": "A nurse is providing a telehealth visit. Which consideration is essential?", "options": ["Confirm privacy, client identity, and the suitability of remote care", "Assume the connection is private", "Use any public social-media account", "Skip assessment because video is available"], "answer": 0, "why": "Telehealth requires confidentiality, appropriate assessment, and secure communication.", "wrong": []}, {"cat": "Informatics", "stem": "A nurse receives a suspicious message requesting an EHR password. What is the best action?", "options": ["Share the password if the sender claims to be IT", "Do not disclose credentials; follow security reporting policy", "Forward the password to the unit", "Write the password on a public board"], "answer": 1, "why": "Credentials are personal and must be protected to prevent unauthorized access.", "wrong": []}, {"cat": "Quality", "stem": "After a medication near miss, the team reviews how workflow and technology contributed. Which process is most appropriate?", "options": ["Root-cause analysis", "Punishing the first person involved", "Ignoring the near miss", "Changing the chart to conceal the event"], "answer": 0, "why": "Root-cause analysis examines contributing human and system factors to prevent recurrence.", "wrong": []}, {"cat": "Quality", "stem": "A unit is testing a new bedside handoff checklist. Which cycle supports iterative improvement?", "options": ["Plan–Do–Study–Act", "Assess–Diagnose–Treat–Discharge", "Order–Administer–Document–Forget", "Collect–Blame–Punish–Repeat"], "answer": 0, "why": "PDSA uses small tests, evaluation of results, and adjustment to improve processes.", "wrong": []}, {"cat": "Quality", "stem": "A client experiences an unexpected event involving serious harm. How is this most appropriately classified?", "options": ["Sentinel event", "Routine variance with no safety implications", "A teaching preference", "A normal discharge outcome"], "answer": 0, "why": "A sentinel event is a serious, unexpected safety event that requires prompt review and response.", "wrong": []}, {"cat": "Quality", "stem": "A nurse notices a near miss that did not reach the client. What should the nurse do?", "options": ["Report it according to policy so risks can be analyzed", "Ignore it because no harm occurred", "Delete evidence of the error", "Tell only friends outside work"], "answer": 0, "why": "Near-miss reporting identifies unsafe processes before they cause harm.", "wrong": []}, {"cat": "Quality", "stem": "A nurse documents an event report. Which entry is appropriate?", "options": ["Objective facts, sequence of events, and actions taken", "Speculation about who is to blame", "Personal insults toward coworkers", "Statements written to conceal a mistake"], "answer": 0, "why": "Event reporting should be factual, timely, and free of unsupported opinions.", "wrong": []}, {"cat": "Quality", "stem": "A nurse observes repeated delays in specimen collection. Which action supports quality improvement?", "options": ["Collect baseline data and test a change", "Assume the problem will resolve itself", "Blame one staff member without review", "Stop documenting delays"], "answer": 0, "why": "Quality improvement begins with identifying a measurable process problem and evaluating change.", "wrong": []}, {"cat": "Professionalism", "stem": "A nurse observes unsafe practice and worries about retaliation. Which action best supports professional accountability?", "options": ["Follow reporting and escalation procedures to protect clients", "Ignore the concern to avoid conflict", "Discuss identifiable details online", "Alter documentation"], "answer": 0, "why": "Professional responsibility includes reporting safety concerns through appropriate channels.", "wrong": []}, {"cat": "Professionalism", "stem": "A nurse is unfamiliar with a new clinical procedure. What is the best action?", "options": ["Seek training and guidance before performing it", "Perform it without preparation", "Ask an unlicensed coworker to take responsibility", "Document completion without doing it"], "answer": 0, "why": "Continuing education and recognizing competence limits protect patient safety.", "wrong": []}, {"cat": "Professionalism", "stem": "A nurse has been working excessive hours and notices difficulty concentrating. What is the best response?", "options": ["Address fatigue and seek appropriate support to maintain safe practice", "Ignore symptoms indefinitely", "Work additional shifts to adapt", "Avoid discussing fatigue with anyone"], "answer": 0, "why": "Self-care and recognition of impairment support safe clinical judgment.", "wrong": []}], "s": [{"cat": "Advocacy", "stem": "Which nursing actions support client advocacy? Select all that apply.", "options": ["Explain the client’s available options in understandable language", "Respect an informed refusal", "Make treatment choices without involving the client", "Arrange an interpreter when needed", "Dismiss concerns that differ from the nurse’s values"], "correct": [0, 1, 3], "reasons": ["Access to understandable options supports informed choice.", "Respecting refusal protects autonomy.", "Making unilateral choices overrides the client’s role.", "Interpretation promotes meaningful participation.", "Dismissing concerns undermines client-centered care."]}, {"cat": "Culture", "stem": "Which actions demonstrate cultural competence? Select all that apply.", "options": ["Ask about individual preferences", "Reflect on personal assumptions", "Assume cultural identity predicts every preference", "Adapt safe care to the client’s values", "Use stereotypes to speed assessment"], "correct": [0, 1, 3], "reasons": ["Individual assessment avoids stereotyping.", "Self-awareness helps identify bias.", "People within the same group have diverse preferences.", "Safe accommodation promotes person-centered care.", "Stereotypes risk inequitable and inaccurate care."]}, {"cat": "Education", "stem": "Which approaches help a client learn a new home-care skill? Select all that apply.", "options": ["Assess readiness and barriers", "Provide return demonstration", "Use teach-back", "Teach during uncontrolled pain without adjustment", "Offer supportive feedback"], "correct": [0, 1, 2, 4], "reasons": ["Readiness affects attention and retention.", "Demonstration ver const games=[['clinical','ATI/NCLEX Clinical Quiz','A continuous, scenario-based quiz with immediate feedback.'],['sata','SATA Mastery','Select all that apply, with individual option rationales.'],['priority','Who Do You See First?','Prioritize the safest nursing response in challenging situations.'],['cases','NGN Unfolding Cases','Three-stage cases with decisions and detailed clinical reasoning.'],['vocab','Vocabulary Matching','Match terms to clinical meanings across five categories.'],['compare','Compare & Contrast','Drag or tap cards into clinically correct categories.'],['teaching','Teach-Back Challenge','Apply patient education, learning domains, and health literacy.'],['ethics','Ethical Decision Lab','Practice autonomy, justice, advocacy, and professional obligations.'],['informatics','Informatics & HIPAA','Protect confidentiality, document accurately, and use technology safely.'],['quality','Quality & Safety Lab','Root-cause analysis, PDSA, incident reporting, and prevention.'],['integrative','Integrative Care Challenge','Identify safe complementary care and supplement considerations.'],['flash','Rapid-Recall Flashcards','Practice key concepts one card at a time.']];
const app=document.getElementById('app');let current='home',activeTile=null,compareIdx=0,vocabCat=0,flashIdx=0,caseIdx=0,caseStep=0;
const storeKey='nur223exam5day3v1';let saved={};try{saved=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){};
function persist(){try{localStorage.setItem(storeKey,JSON.stringify(saved))}catch(e){}};
function mark(key,val){saved[key]=val;persist()};
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};
function head(title,desc){return `<div class="eyebrow">Day 3 • Exam 5</div><h1>${esc(title)}</h1><p class="lead">${esc(desc)}</p>`};
function toolbar(extra=''){return `<div class="toolbar"><button onclick="home()">⌂ Day 3 Home</button>${extra}</div>`};
function home(){current='home';app.innerHTML=head('12-Game Nursing Study Arcade','Practice only the topics covered in your Day 3 slides, using ATI-informed clinical judgment and detailed feedback.')+`<div class="stats"><span class="stat"><b>${DB.q.length}</b> clinical MC questions</span><span class="stat"><b>${DB.s.length}</b> SATA questions</span><span class="stat"><b>${Object.values(DB.v).flat().length}</b> vocabulary terms</span><span class="stat"><b>${DB.c.reduce((n,c)=>n+c.cards.length,0)}</b> comparison cards</span></div><div class="grid">`+games.map(([id,t,d],i)=>`<div class="card"><span class="pill">GAME ${String(i+1).padStart(2,'0')}</span><h3>${esc(t)}</h3><p>${esc(d)}</p><button onclick="openGame('${id}')">Play ${esc(t)}</button></div>`).join('')+`</div><div class="footer">Progress is saved in this browser. Each question provides original clinical reasoning, not copied ATI test items. All content is based on the Day 3 lecture topics.</div>`;window.scrollTo(0,0)};
function openGame(id){current=id;window.scrollTo(0,0);if(id==='clinical'||id==='priority'||id==='teaching'||id==='ethics'||id==='informatics'||id==='quality'||id==='integrative')renderMC(id);else if(id==='sata')renderSATA();else if(id==='cases')renderCases();else if(id==='vocab')renderVocab();else if(id==='compare')renderCompare();else if(id==='flash')renderFlash()};
const filterMap={clinical:()=>true,priority:q=>['Advocacy','Culture','Promotion','Education','Privacy','Informatics','Quality','Professionalism'].includes(q.cat),teaching:q=>q.cat==='Education'||q.cat==='Caring'||q.cat==='Culture',ethics:q=>q.cat==='Ethics'||q.cat==='Advocacy',informatics:q=>q.cat==='Privacy'||q.cat==='Informatics',quality:q=>q.cat==='Quality'||q.cat==='Professionalism',integrative:q=>q.cat==='CAM'||q.cat==='Culture'};
function renderMC(id){let title=games.find(g=>g[0]===id)[1],items=DB.q.map((q,i)=>({...q,i})).filter(filterMap[id]);app.innerHTML=head(title,`All ${items.length} questions appear on one scrollable page. Select one answer for immediate clinical feedback.`)+toolbar(`<span class="pill" id="count">${items.filter(q=>saved[id+q.i]!==undefined).length}/${items.length} answered</span>`)+items.map((q,k)=>`<section class="question" id="q${q.i}"><span class="pill">${esc(q.cat)}</span><h3>${k+1}. ${esc(q.stem)}</h3>${q.options.map((o,j)=>`<button class="option ${saved[id+q.i]!==undefined?(j===q.answer?'correct':j===saved[id+q.i]?'wrong':''):''}" onclick="answerMC('${id}',${q.i},${j})" ${saved[id+q.i]!==undefined?'disabled':''}>${'ABCD'[j]}. ${esc(o)}</button>`).join('')}<div class="feedback ${saved[id+q.i]===undefined?'hidden':saved[id+q.i]===q.answer?'good':'bad'}" id="f${q.i}">${saved[id+q.i]===undefined?'':mcFeedback(q,saved[id+q.i])}</div></section>`).join('')+toolbar(`<button onclick="resetGame('${id}')">Reset this game</button>`)};
function mcFeedback(q,j){let msg=j===q.answer?'Correct.':'Not quite.';return `<strong>${msg} Best answer: ${'ABCD'[q.answer]}.</strong><p>${esc(q.why)}</p>${q.options.map((o,k)=>`<p class="small"><b>${'ABCD'[k]}:</b> ${k===q.answer?esc(q.why):esc(q.wrong[k]||'This option does not address the specific assessment finding or nursing priority as effectively as the best answer in this situation.')}</p>`).join('')}`};
function answerMC(id,i,j){if(saved[id+i]!==undefined)return;mark(id+i,j);renderMC(id);document.getElementById('q'+i)?.scrollIntoView({block:'center'})};
function resetGame(id){if(!confirm('Reset saved answers for this game?'))return;Object.keys(saved).filter(k=>k.startsWith(id)).forEach(k=>delete saved[k]);persist();openGame(id)};
function renderSATA(){app.innerHTML=head('SATA Mastery','Select every correct response. Submit to see why each option is appropriate or unsafe.')+toolbar(`<span class="pill">${DB.s.filter((q,i)=>saved['sata'+i]).length}/${DB.s.length} completed</span>`)+DB.s.map((q,i)=>`<section class="question" id="s${i}"><span class="pill">${esc(q.cat)}</span><h3>${i+1}. ${esc(q.stem)}</h3>${q.options.map((o,j)=>`<label class="checkrow"><input type="checkbox" id="s${i}o${j}" ${saved['sata'+i]?'disabled':''} ${saved['sata'+i]?.includes(j)?'checked':''}>${'ABCDE'[j]}. ${esc(o)}</label>`).join('')}<button id="sb${i}" ${saved['sata'+i]?'disabled':''} onclick="checkSATA(${i})">Check Selected Answers</button><div class="feedback ${saved['sata'+i]?'':'hidden'}" id="sf${i}">${saved['sata'+i]?sataFeedback(q,saved['sata'+i]):''}</div></section>`).join('')+toolbar(`<button onclick="resetGame('sata')">Reset SATA</button>`)};
function sataFeedback(q,chosen){let good=q.correct.length===chosen.length&&q.correct.every(x=>chosen.includes(x));return `<b>${good?'Correct!':'Review these selections.'} Correct options: ${q.correct.map(x=>'ABCDE'[x]).join(', ')}.</b>`+q.reasons.map((r,j)=>`<p class="small"><b>${'ABCDE'[j]} — ${q.correct.includes(j)?'Correct':'Incorrect'}:</b> ${esc(r)}</p>`).join('')};
function checkSATA(i){let sel=DB.s[i].options.map((_,j)=>document.getElementById(`s${i}o${j}`).checked?j:-1).filter(j=>j>=0);if(!sel.length){alert('Select at least one answer.');return}mark('sata'+i,sel);renderSATA();document.getElementById('s'+i)?.scrollIntoView({block:'center'})};
function renderCases(){let c=DB.cases[caseIdx],step=c.steps[caseStep],key=`case${caseIdx}_${caseStep}`;app.innerHTML=head('NGN Unfolding Cases','Follow the evolving situation and select the safest next nursing action.')+toolbar(`<span class="pill">Case ${caseIdx+1}/${DB.cases.length} • Decision ${caseStep+1}/${c.steps.length}</span>`)+`<div class="panel"><h2>${esc(c.title)}</h2><p>${esc(c.story)}</p></div><div class="question"><h3>${esc(step.q)}</h3>${step.a.map((a,j)=>`<button class="option ${saved[key]!==undefined?(j===step.correct?'correct':j===saved[key]?'wrong':''):''}" ${saved[key]!==undefined?'disabled':''} onclick="caseAnswer(${j})">${'ABC'[j]}. ${esc(a)}</button>`).join('')}${saved[key]!==undefined?`<div class="feedback ${saved[key]===step.correct?'good':'bad'}"><b>${saved[key]===step.correct?'Correct.':'Best answer: '+ 'ABC'[step.correct]+'.'}</b><p>${esc(step.why)}</p>${step.a.map((a,j)=>`<p class="small"><b>${'ABC'[j]}:</b> ${j===step.correct?esc(step.why):'This choice would not resolve the immediate clinical, ethical, or safety concern described in this stage.'}</p>`).join('')}</div>`:''}</div><div class="flex"><button ${caseStep===0&&caseIdx===0?'disabled':''} onclick="casePrev()">Previous</button><button ${saved[key]===undefined?'disabled':''} onclick="caseNext()">${caseStep===c.steps.length-1?'Next Case':'Next Decision'}</button></div>`};
function caseAnswer(j){mark(`case${caseIdx}_${caseStep}`,j);renderCases()};function caseNext(){if(caseStep<DB.cases[caseIdx].steps.length-1)caseStep++;else{caseIdx=(caseIdx+1)%DB.cases.length;caseStep=0}renderCases()};function casePrev(){if(caseStep>0)caseStep--;else if(caseIdx>0){caseIdx--;caseStep=DB.cases[caseIdx].steps.length-1}renderCases()};
function renderVocab(){let names=Object.keys(DB.v),cat=names[vocabCat],items=DB.v[cat],done=items.filter((_,i)=>saved['voc'+vocabCat+'_'+i]===true).length;app.innerHTML=head('Vocabulary Matching','Tap or drag a term, then tap or drop it onto its matching definition. Incorrect matches can be retried.')+toolbar(`<span class="pill">${done}/${items.length} matched in category</span>`)+`<div class="flex">${names.map((n,i)=>`<button class="${i===vocabCat?'':'home'}" onclick="vocabCat=${i};activeTile=null;renderVocab()">${esc(n)}</button>`).join('')}</div><div class="panel"><h3>${esc(cat)} — Terms</h3><div id="vterms">${items.map(([term],i)=>`<button draggable="true" ondragstart="dragTile(event,'voc',${i})" class="tile ${saved['voc'+vocabCat+'_'+i]?'done':''}" ${saved['voc'+vocabCat+'_'+i]?'disabled':''} onclick="pickTile('voc',${i})" id="vt${i}">${esc(term)}</button>`).join('')}</div></div><div class="boards">${items.map(([t,def],i)=>`<div class="zone" ondragover="event.preventDefault()" ondrop="dropTile(event,'voc',${i})" onclick="placeTile('voc',${i})"><div class="small">${esc(def)}</div><div id="vz${i}" class="small" style="color:var(--good)">${saved['voc'+vocabCat+'_'+i]?esc(t):''}</div></div>`).join('')}</div><p id="matchmsg" class="feedback hidden"></p>`};
function renderCompare(){let c=DB.c[compareIdx],done=c.cards.filter((_,i)=>saved['cmp'+compareIdx+'_'+i]).length;app.innerHTML=head('Compare & Contrast','Drag or tap a finding, then place it in the correct category. A correct placement locks in.')+toolbar(`<span class="pill">${done}/${c.cards.length} sorted</span>`)+`<div class="flex">${DB.c.map((s,i)=>`<button class="${i===compareIdx?'':'home'}" onclick="compareIdx=${i};activeTile=null;renderCompare()">${esc(s.title)}</button>`).join('')}</div><div class="panel"><h3>Unsorted findings</h3>${c.cards.map(([text],i)=>`<button draggable="true" ondragstart="dragTile(event,'cmp',${i})" class="tile ${saved['cmp'+compareIdx+'_'+i]?'done':''}" ${saved['cmp'+compareIdx+'_'+i]?'disabled':''} onclick="pickTile('cmp',${i})" id="ct${i}">${esc(text)}</button>`).join('')}</div><div class="boards">${c.labels.map((label,i)=>`<div class="zone" ondragover="event.preventDefault()" ondrop="dropTile(event,'cmp',${i})" onclick="placeTile('cmp',${i})"><div class="boardhead">${esc(label)}</div>${c.cards.map(([text,target],j)=>target===i&&saved['cmp'+compareIdx+'_'+j]?`<div class="small" style="margin-top:8px;color:var(--good)">✓ ${esc(text)}</div>`:'').join('')}</div>`).join('')}</div><p id="matchmsg" class="feedback hidden"></p>`};
function pickTile(type,i){activeTile={type,i};document.querySelectorAll('.tile').forEach(t=>t.classList.remove('active'));document.getElementById((type==='voc'?'vt':'ct')+i)?.classList.add('active')};function dragTile(e,type,i){pickTile(type,i);e.dataTransfer.setData('text/plain',JSON.stringify({type,i}))};function dropTile(e,type,target){e.preventDefault();try{activeTile=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(err){}placeTile(type,target)};
function placeTile(type,target){if(!activeTile||activeTile.type!==type)return;let i=activeTile.i,key=type==='voc'?'voc'+vocabCat+'_'+i:'cmp'+compareIdx+'_'+i,correct=type==='voc'?i===target:DB.c[compareIdx].cards[i][1]===target,why=type==='voc'?DB.v[Object.keys(DB.v)[vocabCat]][i][1]:DB.c[compareIdx].cards[i][2];if(saved[key])return;let msg=document.getElementById('matchmsg');msg.classList.remove('hidden');msg.className='feedback '+(correct?'good':'bad');msg.innerHTML=correct?'✓ Correct. '+esc(why):'Try again. '+esc(why);if(correct){mark(key,true);activeTile=null;if(type==='voc')renderVocab();else renderCompare();let m=document.getElementById('matchmsg');m.classList.remove('hidden');m.classList.add('good');m.textContent='✓ Correct. '+why}};
