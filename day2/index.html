:#ffccd2}.feedback .correct{color:#c3ffdf}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 20px}.toolbar select{background:#173651;color:white;border:1px solid #6a8cac;border-radius:9px;padding:10px}.pill{background:#24465e;border-radius:40px;padding:6px 12px;color:#e8f6ff;font-size:13px}#view{min-height:280px}.prompt{font-size:17px;font-weight:650;color:white}.muted{font-size:14px}.drop{min-height:90px;border:2px dashed #6b98b5;border-radius:13px;padding:15px;margin:10px 0}.term{display:inline-block;background:#244d68;border:1px solid #77a9bd;border-radius:10px;padding:9px 11px;margin:4px;cursor:grab;user-select:none}.term.selected{background:#116f71;border-color:#79f4e4}.matchrow{display:grid;grid-template-columns:minmax(145px,1fr) minmax(140px,2fr);gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #31516d}.flash{min-height:190px;display:grid;place-items:center;text-align:center;font-size:24px;font-weight:700;background:#173a58;border:2px solid #4b7996;border-radius:16px;padding:28px;cursor:pointer}.hide{display:none!important}a{color:var(--a)}.progress{height:9px;background:#31506a;border-radius:9px;overflow:hidden;margin:10px 0}.bar{height:100%;background:var(--a);width:0%}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{padding:14px;background:#193954;border-radius:12px}@media(max-width:620px){.cols,.matchrow{grid-template-columns:1fr}header{padding:20px}}

<header><div class="muted">NUR 223 · EXAM 5 · DAY 2</div><h1>Clinical Study Arcade</h1><p>Leukemia · Skin, lung & breast cancer · Cancer treatment · Anemias · Transfusions · Sickle cell</p><button onclick="go('home')">Home</button><span id="saved" class="pill">Progress saved locally</span></header><main><div id="view"></div></main><script>const DB={"questions": [{"topic": "Leukemia", "stem": "A client receiving induction chemotherapy for acute leukemia has an ANC of 320/mm³ and an oral temperature of 38.4°C (101.1°F). What is the priority action?", "options": ["Notify the oncology team immediately and anticipate cultures and prescribed IV antibiotics", "Offer acetaminophen and recheck the temperature in four hours", "Encourage visitors to remain for emotional support", "Obtain a routine CBC at the next scheduled visit"], "correct": [0], "why": ["Fever with profound neutropenia can indicate rapidly progressive infection; urgent assessment and antimicrobial treatment are time-sensitive.", "Antipyretics may mask a dangerous infection and delay definitive treatment.", "Extra visitors increase exposure risk in a profoundly neutropenic client.", "Waiting for routine testing delays evaluation of possible neutropenic sepsis."], "kind": "mc"}, {"topic": "Leukemia", "stem": "A client with leukemia has platelets of 18,000/mm³. Which interventions are appropriate? Select all that apply.", "options": ["Use a soft toothbrush and an electric razor", "Avoid intramuscular injections when possible", "Give aspirin for a mild headache", "Assess for petechiae, hematuria, and bleeding gums"], "correct": [0, 1, 3], "why": ["Gentle oral care and an electric razor reduce mucosal and skin injury.", "IM injections can cause hematomas when platelets are severely low.", "Aspirin inhibits platelet function and increases bleeding risk.", "Skin, urinary, and mucosal bleeding may signal clinically important thrombocytopenia."], "kind": "sata"}, {"topic": "Leukemia", "stem": "A client with CML asks why imatinib was prescribed. Which explanation is most accurate?", "options": ["It targets abnormal BCR::ABL1 signaling associated with the Philadelphia chromosome", "It supplies replacement platelets until marrow function returns", "It destroys all rapidly dividing cells without a specific target", "It is an antibiotic used to prevent neutropenic infection"], "correct": [0], "why": ["Imatinib inhibits the BCR::ABL1 tyrosine kinase driving many CML cases.", "Platelet transfusion supports hemostasis but is not the action of imatinib.", "Nonspecific cytotoxic chemotherapy differs from targeted kinase inhibition.", "Imatinib is antineoplastic therapy, not an antimicrobial."], "kind": "mc"}, {"topic": "Leukemia", "stem": "After leukemia chemotherapy, a client develops nausea, muscle cramps, potassium 6.1 mEq/L, rising creatinine, and elevated uric acid. Which complication is most concerning?", "options": ["Tumor lysis syndrome", "Iron deficiency anemia", "Delayed radiation dermatitis", "Chronic lymphedema"], "correct": [0], "why": ["Rapid malignant-cell breakdown releases potassium, phosphate, and nucleic acids; hyperkalemia and kidney injury are emergencies.", "Iron deficiency does not explain acute hyperkalemia and hyperuricemia after treatment.", "Radiation dermatitis causes local skin effects rather than this metabolic pattern.", "Lymphedema causes swelling, not the characteristic electrolyte abnormalities."], "kind": "mc"}, {"topic": "Leukemia", "stem": "A client with leukemia reports new headache and blurred vision with platelets 12,000/mm³. What should the nurse do first?", "options": ["Escalate urgently for possible intracranial bleeding", "Offer a darkened room and reassess tomorrow", "Encourage vigorous ambulation to improve circulation", "Administer an intramuscular analgesic"], "correct": [0], "why": ["New neurologic symptoms in severe thrombocytopenia can indicate intracranial hemorrhage.", "Delaying assessment risks neurologic deterioration.", "Exertion increases injury risk without addressing possible bleeding.", "IM injection can produce a hematoma in thrombocytopenia."], "kind": "mc"}, {"topic": "Leukemia", "stem": "Which findings should the nurse report promptly in a client with acute leukemia? Select all that apply.", "options": ["New fever and chills", "Bleeding that persists after pressure", "New shortness of breath at rest", "Mild fatigue that improves after rest"], "correct": [0, 1, 2], "why": ["Infection can progress quickly when functional neutrophils are low.", "Persistent bleeding can reflect severe thrombocytopenia.", "Dyspnea may reflect symptomatic anemia, infection, or other serious complications.", "Mild relieved fatigue can occur with anemia, but it is less urgent than acute red flags."], "kind": "sata"}, {"topic": "Skin cancer", "stem": "A client has a dark lesion with asymmetry, irregular borders, varied color, and recent enlargement. What is the priority teaching?", "options": ["Arrange prompt assessment and biopsy as indicated", "Apply sunscreen and wait six months for the lesion to fade", "Scrub the lesion daily to remove abnormal cells", "Cover it with an adhesive dressing indefinitely"], "correct": [0], "why": ["ABCDE changes are concerning for melanoma; tissue diagnosis guides treatment.", "Sun protection is important but does not replace evaluation of a suspicious lesion.", "Scrubbing can injure skin and does not treat malignancy.", "Concealing a changing lesion delays diagnosis."], "kind": "mc"}, {"topic": "Skin cancer", "stem": "A client asks how to lower ultraviolet-related skin cancer risk. Which instructions are appropriate? Select all that apply.", "options": ["Use broad-spectrum SPF 30 or higher sunscreen", "Reapply sunscreen every two hours outdoors and after swimming", "Avoid indoor tanning beds", "Rely on sunscreen alone while staying outdoors all day"], "correct": [0, 1, 2], "why": ["Broad-spectrum sunscreen protects against UVA and UVB exposure.", "Reapplication maintains protection after time, water, or sweating.", "Indoor tanning exposes skin to carcinogenic ultraviolet radiation.", "Shade and protective clothing are also needed; sunscreen does not make unlimited exposure safe."], "kind": "sata"}, {"topic": "Skin cancer", "stem": "After Mohs surgery for a facial skin cancer, which finding needs prompt nursing follow-up?", "options": ["Persistent bleeding saturating the dressing", "Mild tenderness controlled by prescribed analgesia", "Questions about scar care", "Temporary anxiety about appearance"], "correct": [0], "why": ["Persistent postoperative bleeding may require pressure, assessment, and provider notification.", "Expected mild pain can be managed and monitored.", "Scar-care questions are appropriate for routine discharge teaching.", "Body-image concerns deserve support but do not supersede active bleeding."], "kind": "mc"}, {"topic": "Skin cancer", "stem": "A client describes a pearly, waxy, slowly growing lesion on the nose. Which skin cancer pattern does the nurse recognize?", "options": ["Basal cell carcinoma", "Melanoma with classic ABCDE features", "Acute leukemia", "Metastatic lung carcinoma"], "correct": [0], "why": ["Basal cell carcinoma often presents as a pearly or waxy lesion and usually grows slowly.", "Melanoma more often raises concern for pigmented asymmetry, border and color variation, or evolution.", "Leukemia originates in hematopoietic tissue rather than a localized pearly skin lesion.", "A localized pearly lesion is not the typical presentation of lung metastasis."], "kind": "mc"}, {"topic": "Lung cancer", "stem": "A client with lung cancer develops facial swelling, distended neck veins, and worsening dyspnea. What complication should the nurse suspect?", "options": ["Superior vena cava syndrome", "Iron deficiency anemia", "Lymphedema confined to an arm", "Pernicious anemia"], "correct": [0], "why": ["Tumor-related obstruction of venous return from the head and upper body can produce facial/neck swelling and respiratory compromise.", "Iron deficiency may cause fatigue and pallor but not distended neck veins with facial edema.", "Arm lymphedema alone does not explain upper-body venous congestion and dyspnea.", "B12 deficiency does not cause this obstructive venous pattern."], "kind": "mc"}, {"topic": "Lung cancer", "stem": "A client with small-cell lung cancer has new confusion and low serum sodium. Which complication is consistent with these findings?", "options": ["Syndrome of inappropriate antidiuretic hormone secretion (SIADH)", "Tumor lysis syndrome with hyperkalemia", "Acute blood loss anemia", "Platelet transfusion reaction"], "correct": [0], "why": ["Ectopic ADH secretion can cause water retention, hyponatremia, and neurologic changes.", "TLS is marked by cell-breakdown electrolyte changes, especially potassium and phosphate abnormalities.", "Blood loss lowers hemoglobin rather than selectively producing dilutional hyponatremia.", "No transfusion is described and the findings fit SIADH."], "kind": "mc"}, {"topic": "Lung cancer", "stem": "Following lobectomy for lung cancer, which assessments take priority? Select all that apply.", "options": ["Respiratory rate, work of breathing, and oxygenation", "Chest drainage system and surgical site", "Pain control sufficient to support deep breathing", "Routine hair-loss counseling before airway assessment"], "correct": [0, 1, 2], "why": ["Pulmonary surgery can compromise ventilation and gas exchange.", "Drainage and incision checks identify bleeding, air leak concerns, or wound complications.", "Uncontrolled pain inhibits coughing and deep breathing, increasing pulmonary complication risk.", "Chemotherapy-related hair loss teaching is not the immediate postoperative priority."], "kind": "sata"}, {"topic": "Lung cancer", "stem": "A client recovering from thoracic surgery avoids coughing because of incisional pain. Which nursing response best supports recovery?", "options": ["Administer prescribed analgesia and teach incision splinting during coughing", "Tell the client to suppress all coughing until discharge", "Withhold mobility until the incision has healed", "Offer only cold liquids to prevent pneumonia"], "correct": [0], "why": ["Pain control and splinting support effective coughing and lung expansion.", "Suppressing cough can promote retained secretions and atelectasis.", "Prolonged immobility raises pulmonary and thromboembolic risks.", "Fluid temperature does not replace pulmonary hygiene."], "kind": "mc"}, {"topic": "Breast cancer", "stem": "A client taking tamoxifen reports unilateral calf swelling and pain. What should the nurse do?", "options": ["Promptly evaluate and notify the provider for possible venous thromboembolism", "Reassure the client that calf swelling is expected", "Massage the calf to improve venous return", "Recommend doubling the next tamoxifen dose"], "correct": [0], "why": ["Tamoxifen increases thromboembolic risk; unilateral calf symptoms require urgent assessment.", "New unilateral swelling is not a benign expected effect.", "Massage may dislodge a thrombus if one is present.", "Increasing tamoxifen does not treat a suspected clot and may increase harm."], "kind": "mc"}, {"topic": "Breast cancer", "stem": "After axillary lymph node removal, which teaching supports recovery? Select all that apply.", "options": ["Perform prescribed gentle arm exercises as directed", "Report persistent arm swelling or redness", "Protect the affected arm from injury when possible", "Keep the arm completely immobile for several months"], "correct": [0, 1, 2], "why": ["Guided exercises preserve shoulder mobility after surgery.", "Swelling or erythema can indicate lymphedema or infection.", "Avoiding injury reduces infection risk in a limb with impaired lymphatic drainage.", "Prolonged immobility can worsen stiffness and impair function."], "kind": "sata"}, {"topic": "Breast cancer", "stem": "A pathology report identifies an ER-positive breast tumor. Which treatment mechanism should the nurse expect may be considered?", "options": ["Hormonal therapy that blocks estrogen signaling", "Antibiotics to eliminate estrogen-producing bacteria", "Platelet transfusions to stop tumor growth", "Insulin replacement to suppress estrogen receptors"], "correct": [0], "why": ["Hormone-receptor positivity can make endocrine therapy appropriate.", "Breast cancer is not treated by eliminating bacteria that produce estrogen.", "Platelets do not inhibit hormone-dependent tumor growth.", "Insulin is not an endocrine therapy for ER-positive breast cancer."], "kind": "mc"}, {"topic": "Breast cancer", "stem": "A client receiving an aromatase inhibitor asks about long-term monitoring. Which issue is especially relevant?", "options": ["Bone density and fracture risk", "Immediate hearing loss after every dose", "Routine blood transfusion before each dose", "Avoiding all protein in the diet"], "correct": [0], "why": ["Aromatase inhibitors lower estrogen and can accelerate bone loss.", "Ototoxicity is not the key monitoring concern for this drug class.", "Transfusions are not routinely required for aromatase inhibitors.", "Protein restriction does not prevent drug-related bone loss."], "kind": "mc"}, {"topic": "Cancer principles", "stem": "A client has a biopsy showing malignant cells in the colon and imaging showing deposits in the liver. How should the nurse interpret this finding?", "options": ["Distant metastasis consistent with stage IV disease", "A benign tumor that cannot invade tissue", "Carcinoma in situ confined to the original epithelium", "A low grade alone proves the cancer is localized"], "correct": [0], "why": ["Distant organ spread is metastatic disease, corresponding to stage IV for many solid tumors.", "Malignant tumors can invade and metastasize.", "Carcinoma in situ has not invaded beyond its original layer.", "Grade describes cellular differentiation, not the extent of spread."], "kind": "mc"}, {"topic": "Cancer principles", "stem": "Which statements accurately distinguish cancer grade from stage? Select all that apply.", "options": ["Grade describes how abnormal tumor cells look microscopically", "Stage describes the anatomic extent of disease", "TNM includes tumor, regional nodes, and metastasis", "A high grade always means there are distant metastases"], "correct": [0, 1, 2], "why": ["Grade reflects differentiation and cellular appearance.", "Stage addresses tumor extent and spread.", "TNM systematically describes primary tumor, nodes, and distant metastasis.", "A poorly differentiated tumor can still be localized; grade and stage are different."], "kind": "sata"}, {"topic": "Cancer principles", "stem": "A client with metastatic cancer asks whether palliative care means treatment must stop. What is the best response?", "options": ["Palliative care focuses on symptoms and quality of life and can occur alongside disease-directed treatment", "Palliative care is only available during the last 24 hours of life", "Palliative care prohibits chemotherapy and radiation", "Palliative care is the same as declining informed consent"], "correct": [0], "why": ["Palliative services can accompany active cancer treatment at any stage of serious illness.", "Palliative care is not limited to the final hours.", "Disease-directed treatment may continue while receiving palliative support.", "Palliative care supports patient preferences and informed decisions."], "kind": "mc"}, {"topic": "Cancer treatment", "stem": "A client receiving doxorubicin develops new shortness of breath and dependent edema. Which adverse effect is most concerning?", "options": ["Cardiotoxicity and impaired cardiac function", "Expected dark stool from oral iron", "Peripheral neuropathy from vitamin B12 deficiency", "Sunscreen-related skin irritation"], "correct": [0], "why": ["Doxorubicin can damage the myocardium; dyspnea and edema warrant cardiac assessment.", "Dark stools are associated with oral iron, not a cause of new fluid-overload symptoms.", "B12 deficiency can cause neuropathy but not this characteristic new heart failure pattern.", "Skin irritation cannot account for dyspnea and edema."], "kind": "mc"}, {"topic": "Cancer treatment", "stem": "A client receiving cyclophosphamide reports dysuria and blood-tinged urine. What should the nurse suspect?", "options": ["Hemorrhagic cystitis", "Sickle cell vaso-occlusive crisis", "Tamoxifen-associated hot flashes", "An expected harmless change requiring no assessment"], "correct": [0], "why": ["Cyclophosphamide can injure bladder mucosa and cause hemorrhagic cystitis.", "A vaso-occlusive crisis causes ischemic pain and other SCD complications, not this characteristic drug toxicity.", "Hot flashes do not cause hematuria.", "Hematuria is abnormal and requires prompt evaluation."], "kind": "mc"}, {"topic": "Cancer treatment", "stem": "Which teaching is appropriate for a client receiving chemotherapy with myelosuppression? Select all that apply.", "options": ["Report fever promptly", "Avoid exposure to people with contagious illnesses", "Use bleeding precautions when platelets are low", "Assume a normal-looking mouth rules out infection"], "correct": [0, 1, 2], "why": ["Fever may be the first sign of serious infection in neutropenia.", "Limiting infectious exposure helps reduce risk.", "Thrombocytopenia increases risk of bruising and hemorrhage.", "Neutropenic infections can occur without obvious local inflammation."], "kind": "sata"}, {"topic": "Cancer treatment", "stem": "A client receiving a vinca alkaloid develops numbness in both feet and difficulty buttoning clothes. Which adverse effect is likely?", "options": ["Peripheral neuropathy", "Acute hemolytic transfusion reaction", "Severe iron overload from oral iron", "Superior vena cava obstruction"], "correct": [0], "why": ["Vinca alkaloids can cause dose-limiting peripheral nerve toxicity.", "A transfusion reaction presents during or after transfusion with acute systemic findings.", "Iron overload is unrelated to this neurotoxicity pattern.", "SVC obstruction produces facial/neck congestion rather than distal sensory changes."], "kind": "mc"}, {"topic": "Cancer treatment", "stem": "A client receiving external-beam radiation asks how to care for the treated skin. Which instruction is appropriate?", "options": ["Clean gently and follow the radiation team’s skin-care directions", "Scrub away treatment markings with abrasive soap", "Apply heating pads directly over the field", "Use unapproved topical products immediately before each treatment"], "correct": [0], "why": ["Gentle care reduces irritation; product use should follow treatment-team instructions.", "Abrasive scrubbing can damage fragile irradiated skin.", "Heat can worsen irritation and injury.", "Unapproved creams may interfere with treatment or irritate the field."], "kind": "mc"}, {"topic": "Cancer treatment", "stem": "During a chemotherapy infusion, a client reports burning and swelling at the IV site. What is the priority?", "options": ["Stop the infusion and follow the extravasation protocol", "Increase the infusion rate to finish the dose", "Apply firm massage over the site", "Wait until the next scheduled assessment"], "correct": [0], "why": ["Possible vesicant extravasation requires immediate cessation and protocol-based management to limit tissue injury.", "Continuing the infusion increases potential tissue damage.", "Massage may spread the drug into surrounding tissues.", "Delay can worsen local necrosis."], "kind": "mc"}, {"topic": "Cancer treatment", "stem": "A client receiving immunotherapy develops severe new diarrhea and abdominal pain. Which response is most appropriate?", "options": ["Promptly report possible immune-mediated colitis", "Explain that all diarrhea should be ignored during immunotherapy", "Recommend taking an extra immunotherapy dose", "Stop drinking fluids to reduce stool output"], "correct": [0], "why": ["Checkpoint inhibitors can provoke immune-related inflammation requiring timely evaluation.", "Severe diarrhea may indicate significant toxicity rather than a harmless expected effect.", "Extra doses may exacerbate immune toxicity.", "Fluid restriction increases dehydration risk."], "kind": "mc"}, {"topic": "Anemia", "stem": "A client with iron deficiency anemia reports fatigue and dyspnea with activity. Which laboratory pattern most supports iron deficiency?", "options": ["Low hemoglobin with low ferritin", "Normal hemoglobin with high ferritin", "Elevated platelets alone without hemoglobin change", "High hemoglobin and normal red cell indices"], "correct": [0], "why": ["Low ferritin reflects depleted iron stores and supports iron deficiency in the appropriate clinical setting.", "High ferritin does not usually indicate depleted iron stores.", "Platelet count alone cannot establish iron deficiency anemia.", "Normal/high hemoglobin does not fit anemia."], "kind": "mc"}, {"topic": "Anemia", "stem": "A client starting ferrous sulfate asks how to take it. Which teaching is appropriate? Select all that apply.", "options": ["Expect that stools may become darker", "Report severe or persistent gastrointestinal symptoms", "Keep iron tablets out of children’s reach", "Stop the medication whenever stools darken"], "correct": [0, 1, 2], "why": ["Dark stools are a common effect of oral iron.", "Significant adverse effects should be discussed so treatment can be adjusted safely.", "Iron overdose can be life-threatening to children.", "Dark stools alone are generally expected and do not require stopping prescribed therapy."], "kind": "sata"}, {"topic": "Anemia", "stem": "A client has macrocytic anemia, paresthesias, and difficulty with balance. Which deficiency is especially concerning?", "options": ["Vitamin B12 deficiency", "Isolated iron deficiency", "Acute platelet deficiency", "Vitamin C excess"], "correct": [0], "why": ["B12 deficiency can produce macrocytic anemia and neurologic deficits.", "Iron deficiency typically causes microcytic anemia without characteristic neurologic deficits.", "Thrombocytopenia causes bleeding rather than this anemia-neuropathy pattern.", "Vitamin C excess is not a typical cause of macrocytic anemia with paresthesias."], "kind": "mc"}, {"topic": "Anemia", "stem": "A client with pernicious anemia asks why vitamin B12 injections may be necessary. What is the best explanation?", "options": ["Impaired intrinsic-factor-dependent absorption can make parenteral replacement necessary", "Injections are used because B12 is always toxic when swallowed", "B12 injections immediately replace lost platelets", "The injections are antibiotics that treat gastric infection"], "correct": [0], "why": ["Pernicious anemia impairs B12 absorption because of intrinsic factor deficiency.", "Oral B12 is not inherently toxic; route depends on cause and treatment plan.", "B12 supports erythropoiesis and neurologic function rather than directly replacing platelets.", "Cyanocobalamin is a vitamin, not an antibiotic."], "kind": "mc"}, {"topic": "Anemia", "stem": "A client receiving epoetin alfa has rising blood pressure. What is the priority nursing response?", "options": ["Assess blood pressure and notify the prescriber as indicated", "Give a second dose to lower blood pressure", "Assume hypertension is unrelated to the medication", "Stop monitoring hemoglobin after the first injection"], "correct": [0], "why": ["Erythropoiesis-stimulating agents can worsen hypertension; BP and hemoglobin require monitoring.", "Extra epoetin does not treat hypertension and may increase risk.", "Hypertension is a recognized concern with this therapy.", "Hemoglobin monitoring is necessary to assess response and avoid excessive elevation."], "kind": "mc"}, {"topic": "Anemia", "stem": "Which dietary selections support increased iron intake? Select all that apply.", "options": ["Legumes and leafy green vegetables", "Iron-containing meat or shellfish when appropriate", "Tofu and seeds", "Only refined sugar and clear soda"], "correct": [0, 1, 2], "why": ["Legumes and greens can provide nonheme iron.", "Meat and shellfish can provide dietary iron.", "Tofu and seeds are additional iron sources.", "Refined sugar and soda provide little iron or supportive nutrition."], "kind": "sata"}, {"topic": "Anemia", "stem": "A client with anemia becomes dizzy when standing. Which nursing intervention is most appropriate?", "options": ["Assist with ambulation and assess activity tolerance", "Encourage the client to walk independently despite dizziness", "Withhold all vital-sign checks until discharge", "Recommend strenuous exercise to raise hemoglobin immediately"], "correct": [0], "why": ["Anemia can reduce oxygen delivery and cause orthostatic symptoms; fall precautions and assessment are needed.", "Unassisted walking increases fall risk.", "Vital signs help evaluate perfusion and clinical status.", "Strenuous exertion may worsen symptoms and does not immediately correct anemia."], "kind": "mc"}, {"topic": "Transfusion", "stem": "Fifteen minutes after packed RBCs are started, a client develops chills, back pain, and hypotension. What should the nurse do first?", "options": ["Stop the transfusion and keep IV access with normal saline using new tubing", "Slow the transfusion and give the remaining blood", "Discard the blood bag immediately without reporting the reaction", "Give the next unit to confirm whether the reaction recurs"], "correct": [0], "why": ["These findings suggest an acute transfusion reaction; stop the blood and maintain access per protocol.", "Continuing blood exposure may worsen a potentially life-threatening reaction.", "The blood bag and tubing may be needed for investigation and must be handled per protocol.", "Rechallenge is unsafe in a suspected acute reaction."], "kind": "mc"}, {"topic": "Transfusion", "stem": "Before initiating a blood transfusion, which actions are appropriate? Select all that apply.", "options": ["Verify client identity and blood product per policy with required qualified personnel", "Obtain baseline vital signs", "Confirm prescribed product and consent according to policy", "Use a medication line containing dextrose to prime blood tubing"], "correct": [0, 1, 2], "why": ["Correct identification is essential to prevent incompatible transfusion.", "Baseline vitals allow comparison for early reaction recognition.", "Product verification and consent are required safety steps.", "Dextrose solutions are not used to prime blood tubing; normal saline is the standard compatible solution."], "kind": "sata"}, {"topic": "Transfusion", "stem": "A client with severe symptomatic anemia is prescribed packed RBCs. What is the main expected benefit?", "options": ["Increase oxygen-carrying capacity by providing red blood cells", "Treat thrombocytopenia by supplying platelets", "Destroy circulating bacteria directly", "Replace vitamin B12 absorption permanently"], "correct": [0], "why": ["Packed RBCs increase circulating hemoglobin and oxygen delivery.", "Platelet transfusions are used to support platelet count/function.", "RBC units are not antimicrobial therapy.", "Transfusion does not correct the underlying cause of B12 malabsorption."], "kind": "mc"}, {"topic": "Transfusion", "stem": "A client receiving platelets asks why this product is needed. Which explanation is accurate?", "options": ["It helps address thrombocytopenia and bleeding risk", "It primarily replaces missing clotting factors in hemophilia", "It cures iron deficiency by adding iron stores", "It eliminates tumor cells in leukemia"], "correct": [0], "why": ["Platelets support primary hemostasis when platelet numbers/function are inadequate.", "Specific clotting-factor replacement is distinct from platelet transfusion.", "Platelets do not replenish iron stores as iron therapy does.", "Transfusion is supportive care and does not eradicate leukemia."], "kind": "mc"}, {"topic": "Sickle cell", "stem": "A client with sickle cell disease reports severe leg and back pain after several days of poor tem": "A child with sickle cell disease becomes pale and tachycardic with sudden left upper abdominal enlargement and hypotension. What complication is most likely?", "options": ["Splenic sequestration crisis", "Mild iron deficiency without bleeding", "Superior vena cava syndrome", "Chronic chemotherapy neuropathy"], "correct": [0], "why": ["Rapid splenic pooling of blood can cause acute hypovolemia and shock.", "Iron deficiency generally does not cause sudden splenic enlargement and shock.", "SVC syndrome causes upper-body venous congestion, not splenic pooling.", "Peripheral neuropathy does not explain acute hemodynamic collapse."], "kind": "mc"}, {"topic": "Sickle cell", "stem": "A client with sickle cell disease suddenly develops slurred speech and unilateral weakness. What should the nurse do?", "options": ["Activate emergency stroke evaluation immediately", "Give a snack and wait for symptoms to pass", "Apply cold packs to the affected extremities", "Schedule routine clinic follow-up next month"], "correct": [0], "why": ["Sickle cell disease increases ischemic stroke risk; new focal deficits require immediate stroke response.", "Waiting delays time-sensitive neurologic assessment.", "Cold exposure can promote vasoconstriction and does not treat stroke.", "Routine follow-up is inappropriate for acute focal neurologic symptoms."], "kind": "mc"}, {"topic": "Sickle cell", "stem": "Which teaching helps prevent sickle cell crises? Select all that apply.", "options": ["Maintain adequate hydration", "Avoid extreme cold and low-oxygen environments", "Seek prompt evaluation for fever or infection", "Restrict fluids during illness to reduce sickling"], "correct": [0, 1, 2], "why": ["Hydration reduces dehydration-related sickling triggers.", "Cold exposure and hypoxia can promote vaso-occlusion.", "Infection can trigger crises and become serious in clients with functional asplenia.", "Fluid restriction can worsen dehydration and increase crisis risk."], "kind": "sata"}, {"topic": "Sickle cell", "stem": "A client asks why hydroxyurea is prescribed for sickle cell disease. Which response is most accurate?", "options": ["It increases fetal hemoglobin and can reduce vaso-occlusive episodes", "It replaces missing intrinsic factor", "It provides immediate analgesia for an active crisis", "It is a platelet product given during transfusion"], "correct": [0], "why": ["Hydroxyurea increases HbF and can reduce sickling-related complications.", "Intrinsic factor deficiency causes pernicious anemia, not SCD.", "Hydroxyurea is preventive disease-modifying therapy rather than immediate pain relief.", "Hydroxyurea is a medication, not a blood component."], "kind": "mc"}, {"topic": "Sickle cell", "stem": "A client taking hydroxyurea asks why regular blood counts are needed. What is the best explanation?", "options": ["Hydroxyurea can suppress bone marrow and lower blood cell counts", "Blood counts prove the medication cures the genetic condition", "Monitoring is only needed if the client has a rash", "Blood counts replace the need to assess infections"], "correct": [0], "why": ["Hydroxyurea can cause myelosuppression; CBC monitoring guides safe dosing.", "Sickle cell disease remains a genetic condition even with effective therapy.", "Myelosuppression may occur without a rash.", "Infection assessment remains necessary regardless of CBC monitoring."], "kind": "mc"}, {"topic": "Sickle cell", "stem": "Which findings in a client with sickle cell disease require immediate escalation? Select all that apply.", "options": ["New hypoxemia with chest pain", "New one-sided weakness", "Sudden pallor with hypotension and enlarging spleen", "Stable chronic joint discomfort unchanged from baseline"], "correct": [0, 1, 2], "why": ["Respiratory symptoms can indicate acute chest syndrome.", "Focal neurologic findings may signal stroke.", "Acute splenic pooling can lead to hypovolemic shock.", "Stable baseline discomfort needs management but is not equivalent to an acu orrect": [0, 1, 2], "why": ["Gentle oral hygiene reduces trauma to inflamed mucosa.", "Soft, bland foods can reduce discomfort and improve intake.", "Mucositis and immunosuppression increase infection risk.", "Alcohol-containing rinses can worsen dryness and irritation."], "kind": "sata"}, {"topic": "Leukemia", "stem": "A client asks the difference between an autologous and an allogeneic stem cell transplant. Which statement is correct?", "options": ["Autologous uses the client’s own stem cells; allogeneic uses donor cells", "Both procedures always use cells from an unrelated donor", "Allogeneic uses only the client’s own cells", "Neither procedure is intended to restore hematopoiesis"], "correct": [0], "why": ["The distinction is the source of transplanted stem cells; both aim to reestablish blood cell production.", "Autologous transplants use self-derived cells.", "Allogeneic cells come from a donor.", "Hematopoietic recovery is a central transplant goal."], "kind": "mc"}, {"topic": "Skin cancer", "stem": "A client with a suspicious skin lesion asks why the provider is concerned about melanoma. What is most important?", "options": ["Melanoma can invade and metastasize, so early diagnosis matters", "Melanoma never spreads beyond the skin", "Melanoma is the same as a noncancerous mole", "Melanoma is diagnosed by the absence of all skin changes"], "correct": [0], "why": ["Melanoma can spread and requires prompt evaluation of concerning lesions.", "Melanoma can metastasize.", "Not every mole is melanoma; evolving suspicious lesions need assessment.", "Clinical changes such as ABCDE features can raise suspicion."], "kind": "mc"}, {"topic": "Cancer treatment", "stem": "A client receiving radiation asks how internal radiation (brachytherapy) differs from external beam therapy. Which response is accurate?", "options": ["Brachytherapy places a radiation source in or near the treatment area", "External beam therapy always requires implanted radioactive seeds", "Both approaches are blood transfusion procedures", "Brachytherapy is a form of oral iron therapy"], "correct": [0], "why": ["Brachytherapy delivers radiation locally using a source placed in or near a tumor.", "External beam radiation comes from equipment outside the body.", "Radiation and transfusion are distinct treatments.", "Iron replacement has no relation to radiation source placement."], "kind": "mc"}, {"topic": "Anemia", "stem": "A client has fatigue and pallor after a recent gastrointestinal bleed. Which mechanism most directly explains the anemia?", "options": ["Loss of circulating red blood cells decreases oxygen-carrying capacity", "Excess intrinsic factor destroys platelets", "An increase in fetal hemoglobin causes hypoxia", "An elevated white blood cell count always increases hemoglobin"], "correct": [0], "why": ["Blood loss reduces circulating RBC mass and hemoglobin available for oxygen delivery.", "Intrinsic factor is involved in B12 absorption, not acute RBC loss.", "HbF is not the cause of acute post-bleed anemia.", "White cell numbers do not replace lost red cells."], "kind": "mc"}, {"topic": "Lung cancer", "stem": "A client with a suspicious pulmonary mass asks why bronchoscopy with biopsy is ordered. What is the best explanation?", "options": ["It can obtain tissue for diagnosis and classification", "It is used only to measure blood glucose", "It permanently prevents all future lung tumors", "It replaces all imaging used to stage lung cancer"], "correct": [0], "why": ["Bronchoscopy can sample lesions for pathologic examination.", "Glucose measurement is unrelated to bronchoscopy.", "A diagnostic procedure does not guarantee prevention.", "Imaging and other staging tests may still be needed."], "kind": "mc"}, {"topic": "Breast cancer", "stem": "A client notices new nipple retraction and skin dimpling. What is the appropriate advice?", "options": ["Seek prompt clinical breast evaluation", "Assume these changes are normal aging", "Massage the breast daily for  "Telling the client they must accept every offered treatment"], "correct": [0, 1, 2], "why": ["Meaningful consent requires information about benefits, harms, and alternatives.", "Autonomy includes the right to refuse treatment.", "Goals-of-care discussions align interventions with client values.", "Coercion violates informed decision-making."], "kind": "sata"}, {"topic": "Leukemia", "stem": "A client with acute leukemia is profoundly fatigued, pale, and tachycardic with low hemoglobin. Which underlying mechanism best explains these findings?", "options": ["Marrow crowding reduces normal red blood cell production", "Excess normal erythrocytes increase blood viscosity", "Melanin production decreases tissue oxygenation", "Platelet transfusion increases red cell destruction"], "correct": [0], "why": ["Leukemic cells can suppress normal hematopoiesis, leading to symptomatic anemia.", "Excess erythrocytes is not the mechanism of leukemia-related anemia.", "Melanin is unrelated to marrow production of red cells.", "Platelet transfusion does not explain baseline anemia in untreated leukemia."], "kind": "mc"}], "vocab": [["Leukemia", "ANC", "Absolute neutrophil count used to assess infection risk"], ["Leukemia", "Neutropenia", "Low neutrophils with increased susceptibility to infection"], ["Leukemia", "Thrombocytopenia", "Low platelets with increased bleeding risk"], ["Leukemia", "BCR::ABL1", "Fusion kinase associated with Philadelphia-positive CML"], ["Leukemia", "Tumor lysis syndrome", "Metabolic emergency after rapid tumor-cell breakdown"], ["Leukemia", "Allogeneic transplant", "Stem cells obtained from a donor"], ["Leukemia", "Autologous transplant", "Stem cells obtained from the patient"], ["Skin cancer", "ABCDE", "Asymmetry, Border, Color, Diameter, Evolution"], ["Skin cancer", "Melanoma", "Skin cancer with significant potential for metastasis"], ["Skin cancer", "Basal cell carcinoma", "Common slow-growing pearly or waxy skin cancer"], ["Skin cancer", "Mohs surgery", function options(q,idx,key){const a=state.answers[key],selected=a?.selected||window._temp?.[key]||[];let out=`<div class="question"><div class="muted">${esc(q.topic)} · ${q.kind==='sata'?'SELECT ALL THAT APPLY':'ONE BEST ANSWER'}</div><p class="prompt">${esc(q.stem)}</p>`;q.options.forEach((o,j)=>{let cls=a?(q.correct.includes(j)?'good':selected.includes(j)?'bad':''):(selected.includes(j)?'chosen':'');out+=`<button class="option ${cls}" ${a?'disabled':''} onclick="choose('${key}',${idx},${j})">${String.fromCharCode(65+j)}. ${esc(o)} ${a&&q.correct.includes(j)?'✓':''}</button>`});if(!a&&q.kind==='sata')out+=`<button class="primary" onclick="check('${key}',${idx})">Check answers</button>`;if(a){let good=q.correct.length===a.selected.length&&q.correct.every(x=>a.selected.includes(x));out+=`<div class="feedback"><strong class="${good?'correct':'incorrect'}">${good?'Correct':'Review this answer'}</strong><p>Correct answer${q.correct.length>1?'s':''}: ${q.correct.map(x=>String.fromCharCode(65+x)).join(', ')}</p>${q.options.map((o,j)=>`<p><strong>${String.fromCharCode(65+j)} — ${q.correct.includes(j)?'Correct':'Incorrect'}:</strong> ${esc(q.why[j])}</p>`).join('')}</div>`}return out+'</div>'}

function resetMode(mode){if(!confirm('Reset answers for this game?'))return;Object.keys(state.answers).filter(k=>k.startsWith(mode+'_')).forEach(k=>delete state.answers[k]);save();render()}
const VOCAB_GROUPS={"Leukemia & Blood Disorders":["Leukemia","Anemia","Sickle cell"],"Cancer Principles & Treatment":["Cancer principles","Cancer treatment"],"Solid Tumors":["Breast cancer","Lung cancer","Skin cancer"],"Transfusion Safety":["Transfusion"]};
function matching(){let groups=Object.keys(VOCAB_GROUPS),group=matchCat==='All'?'All':matchCat;let terms=V.map((v,i)=>({v,i})).filter(x=>group==='All'||VOCAB_GROUPS[group]?.includes(x.v[0]));let order=terms.slice().sort((a,b)=>((a.i*17+7)%101)-((b.i*17+7)%101));let done=terms.filter(x=>state.matches[x.i]).length;el.innerHTML=`<h2>Vocabulary Matching</h2><p class="muted">Day 1-style two-column matching: select a term, then choose its definition. Four focused categories keep the game organized.</p><div class="toolbar"><select onchange="matchCat=this.value;selectedTerm=null;render()"><option value="All">All categories</option>${groups.map(g=>`<option ${matchCat===g?'selected':''}>${esc(g)}</option>`).join('')}</select><span class="pill">${done}/${terms.length} matched</span><button onclick="if(confirm('Reset matches in this category?')){${'terms.forEach(x=>delete state.matches[x.i])'};selectedTerm=null;save();render()}">Reset category</button></div><div class="progress"><div class="bar" style="width:${pct(done,terms.length)}%"></div></div><div class="match-columns"><div class="match-column"><h3>Terms</h3><div class="match-terms">${terms.map(({v,i})=>`<button class="${state.matches[i]?'done':''} ${selectedTerm===i?'selected':''}" ${state.matches[i]?'disabled':''} onclick="selectTerm(${i})">${esc(v[1])}</button>`).join('')}</div></div><div class="match-column"><h3>Definitions</h3><div class="match-definitions">${order.map(({v,i})=>`<button class="${state.matches[i]?'done':''}" ${state.matches[i]?'disabled':''} onclick="match(${i},selectedTerm)">${esc(v[2])}</button>`).join('')}</div></div></div><div id="match-status" class="compare-feedback" role="status">${done===terms.length?'All terms in this category matched!':'Select a term and then its definition.'}</div>`}
function selectTerm(i){selectedTerm=i;document.querySelectorAll('.match-terms button').forEach(b=>b.classList.remove('selected'));render()}
function match(i,j){let msg=document.getElementById('match-status');if(j===null||j===undefined||Number.isNaN(j)){if(msg)msg.textContent='Select a term first.';return}if(state.matches[i])return;if(i===j){state.matches[i]=true;selectedTerm=null;save();render();let status=document.getElementById('match-status');if(status)status.textContent='Correct match!'}else if(msg){msg.textContent='Not quite. Try another definition; your selected term remains active.'}}
function flash(){let v=V[flashIdx%V.length];el.innerHTML=`<h2>Active Recall Flashcards</h2><p class="muted">${flashIdx%V.length+1} of ${V.length} · ${esc(v[0])} · Tap to flip</p><div class="progress"><div class="bar" style="width:${pct(Object.keys(state.flash).length,V.length)}%"></div></div><div class="flash" onclick="flipped=!flipped;render()">${esc(flipped?v[2]:v[1])}</div><div class="toolbar"><button onclick="flashIdx=(flashIdx-1+V.length)%V.length;flipped=false;render()">Previous</button><button onclick="flipped=!flipped;render()">Flip card</button><button class="primary" onclick="state.flash[flashIdx%V.length]=true;save();flashIdx=(flashIdx+1)%V.length;flipped=false;render()">Mark reviewed & next</button><button onclick="flashIdx=(flashIdx+1)%V.length;flipped=false;render()">Skip</button></div><p class="muted">${Object.keys(state.flash).length} unique cards reviewed.</p>`}
const CASES=[{name:'Febrile neutropenia',intro:'A client with acute leukemia is on chemotherapy. ANC is 320/mm³; temperature is 38.4°C.',ids:[0,5,1]},{name:'Lung cancer complications',intro:'A client with lung cancer develops new respiratory and systemic findings.',ids:[10,11,12]},{name:'Breast cancer care',intro:'A client receiving breast cancer therapy reports new symptoms and asks about recovery.',ids:[14,15,16]},{name:'Chemotherapy safety',intro:'A client receiving systemic antineoplastic treatment develops new adverse effects.',ids:[20,21,25]},{name:'Anemia and transfusion',intro:'A client with symptomatic anemia requires treatment and close monitoring.',ids:[27,34,35]},{name:'Sickle cell emergency',intro:'A client with sickle cell disease presents with pain and subsequently develops alarming symptoms.',ids:[38,40,42]}];
function cases(){let out='<h2>NGN Unfolding Cases</h2><p class="muted">Each case unfolds through three clinically linked decisions. Review the rationale for every option before moving on.</p>';CASES.forEach((c,ci)=>{let step=0;while(step<c.ids.length&&state.answers['case'+ci+'_'+c.ids[step]])step++;let i=c.ids[Math.min(step,c.ids.length-1)];out+=`<div class="card"><h3>Case ${ci+1}: ${c.name}</h3><p>${c.intro}</p><span class="pill">${step}/3 decisions completed</span></div>${step===3?'<p class="feedback correct">Case completed. All decisions reviewed.</p>':options(Q[i],i,'case'+ci+'_'+i)}`});el.innerHTML=out}
function subset(mode){let picks={boss:[0,3,4,10,11,12,14,20,21,25,34,35,40,41,42,43,44],compare:[2,6,9,11,16,17,18,19,27,29,30,31,36,38,39,45,46,47],meds:[2,14,17,20,21,23,24,25,28,31,32,37,44],triage:[0,3,4,10,11,12,14,21,25,34,40,41,42,43],labs:[0,1,3,4,11,19,27,29,31,32,34,39,44],teach:[6,7,8,13,15,17,22,24,28,30,36,43,45,47]};return picks[mode]||[]}
function review(){let ids=Q.map((q,i)=>i).filter(i=>{let a=state.answers['quiz_'+i];return !a||!(a.selected.length===q.correct.length&&q.correct.every(x=>a.selected.includes(x)))});el.innerHTML=`<h2>Missed & Unanswered Review</h2><p class="muted">${ids.length} questions missed or not yet answered in the main quiz.</p>${ids.map(i=>options(Q[i],i,'review_'+i)).join('')||'<p>All main-quiz questions answered correctly!</p>'}`}
const DAY2_COMPARE_SETS=[["Acute vs. Chronic Leukemia", ["Acute leukemia", "Chronic leukemia"], [["Rapid progression with immature blast cells", 0, "Acute leukemia features rapidly proliferating immature cells."], ["Urgent induction therapy may be required", 0, "Acute leukemia can progress quickly and requires prompt treatment."], ["Bone marrow suppression with infection or bleeding risk", 0, "Blasts crowd out normal marrow production."], ["Often slower disease course", 1, "Chronic leukemias can progress more gradually."], ["May be detected on routine blood testing", 1, "Some patients have few symptoms initially."], ["Mature-appearing abnormal leukocytes may predominate", 1, "Chronic leukemias often involve more differentiated cells."]]], ["Iron-Deficiency vs. Vitamin B12-Deficiency Anemia", ["Iron deficiency", "Vitamin B12 deficiency"], [["Microcytic, hypochromic red blood cells", 0, "Low iron limits hemoglobin synthesis, producing small pale cells."], ["Iron replacement and assessment for blood loss", 0, "Correcting deficiency requires replacement and evaluating its cause."], ["Low ferritin is a characteristic finding", 0, "Ferritin reflects depleted iron stores."], ["Paresthesias or gait difficulty", 1, "B12 deficiency can cause neurologic injury."], ["Macrocytic red blood cells", 1, "Impaired DNA synthesis produces enlarged erythrocytes."], ["Vitamin B12 replacement", 1, "Replacing B12 addresses the underlying deficiency."]]], ["Transfusion Reaction: Hemolytic vs. Allergic", ["Acute hemolytic reaction", "Allergic reaction"], [["Fever, chills, back or flank pain", 0, "Immune destruction of donor erythrocytes can produce fever and flank pain."], ["Dark urine or hemoglobinuria", 0, "Intravascular red cell destruction releases hemoglobin into urine."], ["Potential hypotension and acute kidney injury", 0, "Severe hemolysis may cause shock and renal injury."], ["Pruritus or urticaria", 1, "Histamine release can cause itching and hives."], ["Localized flushing or rash", 1, "Cutaneous hypersensitivity can cause flushing and rash."], ["Airway swelling or wheezing in severe cases", 1, "Severe allergic reactions can progress to anaphylaxis."]]], ["Sickle Cell: Vaso-Occlusive vs. Acute Chest Syndrome", ["Vaso-occlusive crisis", "Acute chest syndrome"], [["Severe bone or joint pain", 0, "Sickled cells obstruct microvascular blood flow and cause ischemic pain."], ["Pain management is a major treatment priority", 0, "Rapid analgesia treats significant ischemic pain."], ["Can be triggered by dehydration", 0, "Dehydration promotes sickling and microvascular obstruction."], ["New pulmonary infiltrate with respiratory symptoms", 1, "Acute chest syndrome includes new lung infiltrates and respiratory findings."], ["Hypoxemia or falling oxygen saturation", 1, "Pulmonary involvement can impair oxygenation."], ["Fever, cough, and chest pain", 1, "Respiratory and systemic symptoms suggest acute chest syndrome."]]], ["Cancer Treatment: Chemotherapy vs. Radiation", ["Systemic chemotherapy", "Radiation therapy"], [["Can cause neutropenia and thrombocytopenia", 0, "Systemic cytotoxic drugs suppress rapidly dividing bone marrow cells."], ["May cause generalized alopecia", 0, "Systemic treatment can damage hair follicles."], ["Often affects rapidly dividing cells throughout the body", 0, "Many chemotherapy agents circulate systemically."], ["Skin irritation confined to the treated field", 1, "Radiation injury often occurs in the exposed tissue."], ["Care focuses on protecting the marked treatment area", 1, "Avoiding friction and irritants reduces local skin damage."], ["Treatment is directed at a defined anatomic area", 1, "External-beam radiation targets a planned region."]]]];let compareSet=0,compareSelected=null,compareFeedback='';state.compare=state.compare||{};
function compareData(){return DAY2_COMPARE_SETS[compareSet]}
function compareKey(){return 'set_'+compareSet}
function comparePlaced(){return state.compare[compareKey()]||{}}
function compareTile(i,entry){return `<button class="compare-tile ${compareSelected===i?'selected':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}')" onclick="event.stopPropagation();compareSelected=${i};renderCompare()" title="${esc(entry[2])}">${esc(entry[0])}</button>`}
function compareDrop(event,side){event.preventDefault();event.currentTarget.classList.remove('over');let i=Number(event.dataTransfer.getData('text/plain'));if(Number.isInteger(i)&&event.dataTransfer.getData('text/plain')!=='')comparePlace(i,side)}
function comparePlaceSelected(side){if(compareSelected!==null)comparePlace(compareSelected,side)}
function comparePlace(i,side){let entry=compareData()[2][i];if(!entry)return;if(entry[1]===side){state.compare[compareKey()]=state.compare[compareKey()]||{};state.compare[compareKey()][i]=side;compareFeedback='Correct: '+entry[2];compareSelected=null;save()}else{compareFeedback='Try again: '+entry[2]+' This finding belongs under '+compareData()[1][entry[1]]+'.'}renderCompare()}
function compareReset(){if(confirm('Reset this comparison?')){delete state.compare[compareKey()];compareSelected=null;compareFeedback='';save();renderCompare()}}
function renderCompare(){let set=compareData(),placed=comparePlaced(),cards=set[2],count=Object.keys(placed).length;el.innerHTML=`<h2>Compare & Contrast — Drag & Drop</h2><p class="muted">Day 1-style sorting: drag each clinical finding into the correct condition, or tap a finding and then tap its destination. Each choice gives clinical feedback.</p><div class="toolbar"><select onchange="compareSet=Number(this.value);compareSelected=null;compareFeedback='';renderCompare()">${DAY2_COMPARE_SETS.map((x,i)=>`<option value="${i}" ${compareSet===i?'selected':''}>${esc(x[0])}</option>`).join('')}</select><span class="pill">${count}/${cards.length} correct</span><button onclick="compareReset()">Reset comparison</button></div><div class="progress"><div class="bar" style="width:${pct(count,cards.length)}%"></div></div><div class="card"><h3>Findings to sort</h3><div class="compare-bank" ondragover="event.preventDefault()">${cards.map((entry,i)=>placed[i]===undefined?compareTile(i,entry):'').join('')||'<p>All findings sorted correctly!</p>'}</div><div class="compare-board">${set[1].map((label,side)=>`<div class="compare-zone" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="compareDrop(event,${side})" onclick="comparePlaceSelected(${side})"><h3>${esc(label)}</h3><div class="compare-note">Drop a finding here, or tap after selecting it</div>${cards.map((entry,i)=>placed[i]===side?`<div class="compare-tile" title="${esc(entry[2])}">${esc(entry[0])}</div>`:'').join('')}</div>`).join('')}</div><div class="compare-feedback" role="status">${esc(compareFeedback|| (count===cards.length?'Excellent! All findings sorted correctly.':'Each finding has one best match.'))}</div></div>`}
function render(){if(screen==='home')home();else if(screen==='matching')matching();else if(screen==='compare')renderCompare();else if(screen==='flash')flash();else if(screen==='cases')cases();else if(screen==='review')review();else if(screen==='quiz')quiz();else if(screen==='sata')quiz(Q.map((q,i)=>q.kind==='sata'?i:-1).filter(i=>i>=0),'SATA Mastery','Select every correct option, then check answers.','sata');else{let names={boss:'Priority Boss Battle',compare:'Compare & Contrast',meds:'Medication Safety Lab',triage:'Who Comes First?',labs:'Labs & Red Flags',teach:'Patient Teaching Challenge'};quiz(subset(screen),names[screen],'Focused clinical decisions with answer-specific rationales. Answers save separately for this game.',screen)}}render();</script><script id="three-day-site-nav">(function(){
const allowed=new Set(['quiz','cases','matching','flash','boss','compare','meds','triage','sata','labs','teach','review']);
const selected=decodeURIComponent(location.hash.slice(1)).replace(/^game=/,'');
if(allowed.has(selected)){try{go(id)}catch(err){console.error('Could not open game',err)}}
})();</script></body></html>
